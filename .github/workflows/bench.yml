name: bench:scene

# PR마다 bench:scene:sweep을 실행하여 baseline 대비 fps diff를 코멘트.
# CI 헤드리스 환경 변동성이 크므로 best-effort(continue-on-error) 운용.

# ── hashFiles silent-skip 정책 (#950) — SSoT 는 ci.yml §hashFiles silent-skip 정책 블록 (#945) ──
# 본 파일의 유일한 hashFiles 조건 (`bench-summary.md`) 은 **(a) 정상 케이스**였다 — 가드 자산이
#   아니라 `bench:scene:sweep` 이 run 중 생성하는 **런타임 산출물** (BENCH_SUMMARY_OUT, 저장소
#   미tracked) 이라 "부재" = bench 가 요약 기록 전에 죽은 정상 시나리오이지 가드 소멸이 아니다.
#   writer 는 scripts/bench-scene.mjs 의 두 곳 — 실패 경로의 `reportMeasurementFailure()` 와
#   말미의 `// CI 연동: Markdown 요약을 BENCH_SUMMARY_OUT 경로에 기록` 블록.
#   ⚠️ 행 번호로 가리키지 않는다 — #1209 이 후자를 아래로 밀어 이 주석이 죽은 참조가 됐다
#   (PR #1245 권고 4). 구조 경계(함수명·절 제목)는 같은 변경에서 썩지 않는다.
#   ⚠️ #1209 이 실패 경로 writer 를 신설하면서 "부재" 의 의미가 **좁아졌다** — 측정이 실패해도
#   이제는 요약을 쓰므로, 부재는 그 핸들러에 **도달하기 전** 죽은 경우만 남는다.
# 그럼에도 조건으로 남기면 "가드 부재" 와 "산출물 부재" 가 같은 문법을 써서 정책이 다시 갈라진다.
#   #945 가 ci.yml 에서 R1 diff 이미지 업로드를 `if-no-files-found: ignore` 로 옮겨 **예외 0** 을
#   달성한 것과 동일하게, 본 스텝도 조건이 아니라 **액션 옵션** (`ignore_empty`) 으로 표현한다.
#   sticky-pull-request-comment 의 등가 옵션임은 action.yml + src 실측 확인 —
#   path glob 이 0건 매칭이면 body 가 빈 문자열이 되고 `!body && ignoreEmpty` 로 조기 return
#   (src/main.ts) 하므로 `if-no-files-found: ignore` 와 의미가 같다.

# 중복 run 제거 (#779 표준 블록, #846 에서 누락 보강). group 에 github.workflow 포함 →
# 워크플로 간 교차 취소 방지.
# group 에 github.ref 포함 (#971 Phase 0) → pull_request(refs/pull/N/merge) 와 push(refs/heads/*)
#   가 별도 group. 같은 sha 의 push↔PR 교차 취소와 ff-sync 의 main↔develop 교차 취소가 소멸한다
#   (required check 하에서 cancelled 는 미통과 결론 = 릴리스 하드 블록). SSoT: ADR
#   docs/decisions/20260807-971-required-status-checks.md §2-7 / §5 (b) / 결정 3.
#   본 workflow 는 `pull_request` 전용이라 ref 가 상수 (`refs/pull/N/merge`) — 동작 변화 0 이고
#   표준 블록 정합을 위해 함께 적용한다.
# cancel 은 가드 약화 아님 — 같은 ref·같은 sha 의 재트리거 중복만 제거 (포착 100%). 본 workflow 는
#   `timeout-minutes: 30` 이라 연속 push 시 30분 job 이 중첩돼 러너 점유가 특히 크다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/bench-scene.mjs'
      # #1209 B7 — 판정선 모듈. 여기가 빠지면 **판정선을 바꾼 PR 에서 bench 가 안 돈다**
      #   (가드 술어가 계약보다 좁아지는 클래스 — #1147).
      - 'scripts/bench-judge.mjs'
      - 'docs/benchmarks/baseline.json'
      - '.github/workflows/bench.yml'
      # #814 — setup 구간이 composite (#802 SSoT) 의존이므로 composite 변경 PR 에서도 발화
      - '.github/actions/setup-and-build/**'

jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    # P3-0(#125): sweep N=5000/10000 추가로 측정 시간 증가. 기본 6h → 30m로 명시.
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # setup 공통 구간 (pnpm/node/rust/wasm-pack/playwright 캐시/build) — #802 SSoT, #814 치환.
      # pnpm 버전: 기존 version: 10.32.1 명시 핀 → package.json packageManager (pnpm@10.32.1)
      #   위임으로 전환 — 동일 버전, 핀 SSoT 일원화 (ci.yml 등 기존 composite 경로와 동일 방식).
      # bench 는 production `next start` 필요 → start-dev-server 기본값 (false) + 자체 기동 step 유지.
      - name: setup + build (composite)
        uses: ./.github/actions/setup-and-build

      - name: 웹 서버 기동 (백그라운드)
        run: |
          pnpm --filter @astro-simulator/web start -p 3001 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
          # 서버 준비 대기
          for i in {1..30}; do
            if curl -sf http://localhost:3001/ > /dev/null; then break; fi
            sleep 2
          done

      # #1209 B7 — `BENCH_REGRESSION_FPS: '-10'` (절대 fps 차) 제거. 판정선은
      #   `scripts/bench-judge.mjs` 의 `REGRESSION_RATIO` (baseline 대비 상대 하락폭) 이며
      #   **환경변수 우회 knob 을 두지 않는다** — 판정선을 워크플로에서 조용히 끌 수 있는
      #   손잡이는 그 자체로 가드 무력화 경로다. 절대 임계는 러너 산포(회차 전역 인자
      #   rsd 14.9%) 와 단위가 맞지 않아 같은 커밋 10 회차에서 4/10 회차 오발화했다.
      - name: bench:scene:sweep
        env:
          BENCH_PHASE: pr-${{ github.event.pull_request.number }}
          BENCH_SUMMARY_OUT: bench-summary.md
        run: pnpm bench:scene:sweep

      # `if: always()` 는 앞 스텝 실패 시에도 게시하려는 **결과 조건** 이라 유지 (파일 존재 조건 아님).
      # 산출물 부재는 위 §정책대로 액션 옵션으로 흡수 — 부재 시 "skip step by ignoreEmpty" 로그만 남고
      # 스텝은 성공한다 (조건부 스킵과 달리 **왜 안 올렸는지가 로그에 남는다**).
      - name: PR 코멘트 게시
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-scene
          path: bench-summary.md
          ignore_empty: 'true'

      - name: 서버 종료
        if: always()
        run: kill $WEB_PID || true
