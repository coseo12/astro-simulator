name: bench:scene

# PR마다 bench:scene:sweep을 실행하여 baseline 대비 fps diff를 코멘트.
# CI 헤드리스 환경 변동성이 크므로 best-effort(continue-on-error) 운용.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/bench-scene.mjs'
      - 'docs/benchmarks/baseline.json'
      - '.github/workflows/bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    # P3-0(#125): sweep N=5000/10000 추가로 측정 시간 증가. 기본 6h → 30m로 명시.
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          # #666 (Amendment 4) — 정확 버전 중앙 파일 일원화 (기존 node-version: 20).
          #   bench 측정 루프는 WASM + Chromium headless 로 Node 버전 비종속 (baseline
          #   environment="gh-actions-ubuntu-chromium-headless", Node 버전 미기록) → 20→22
          #   통일이 bench 수치에 영향 없음. #606 playwright extract deadlock 회피 정합.
          node-version-file: '.node-version'
          cache: pnpm

      - name: Rust 툴체인 설정
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          targets: wasm32-unknown-unknown

      # Rust 빌드 캐시 — cargo registry + target/ 재사용 (pnpm build 산하 wasm-pack 빌드 단축)
      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm

      # wasm-pack: cargo install(≈60s) → prebuilt 바이너리로 대체
      - name: wasm-pack 설치
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # Playwright 바이너리 캐시 — #684. extract deadlock (#606) 2차 방어 (Node 22 핀 #663 이 1차).
      # 캐시 히트 시 ~/.cache/ms-playwright 복원 → extract 단계 자체 미발생.
      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # key: runner OS + lockfile hash. @playwright/test 버전이 lockfile 에 포함되므로
          # playwright 버전 변경 시 자동 무효화 (stale 바이너리 서빙 0). 무관 lock 변경 시
          # over-eager miss (전체 재설치) 가능하나 안전 방향 (느려질 뿐, fallback = 기존 동작).
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright 브라우저 설치 (캐시 미스 — 다운로드+extract)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright 시스템 deps (캐시 히트 — extract 생략 = deadlock 2차 방어)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: 앱 빌드
        run: pnpm build

      - name: 웹 서버 기동 (백그라운드)
        run: |
          pnpm --filter @astro-simulator/web start -p 3001 &
          echo "WEB_PID=$!" >> $GITHUB_ENV
          # 서버 준비 대기
          for i in {1..30}; do
            if curl -sf http://localhost:3001/ko > /dev/null; then break; fi
            sleep 2
          done

      - name: bench:scene:sweep
        env:
          BENCH_PHASE: pr-${{ github.event.pull_request.number }}
          BENCH_SUMMARY_OUT: bench-summary.md
          BENCH_REGRESSION_FPS: '-10'
        run: pnpm bench:scene:sweep

      - name: PR 코멘트 게시
        if: always() && hashFiles('bench-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-scene
          path: bench-summary.md

      - name: 서버 종료
        if: always()
        run: kill $WEB_PID || true
