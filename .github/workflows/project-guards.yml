name: Project Guards

# 중복 run 제거 (#779). group 에 github.workflow 포함 → 워크플로 간 교차 취소 방지.
# group 에 github.ref 포함 (#971 Phase 0) → pull_request(refs/pull/N/merge) 와 push(refs/heads/*)
#   가 별도 group. 같은 sha 의 push↔PR 교차 취소와 ff-sync 의 main↔develop 교차 취소가 소멸한다
#   (required check 하에서 cancelled 는 미통과 결론 = 릴리스 하드 블록). SSoT: ADR
#   docs/decisions/20260807-971-required-status-checks.md §2-7 / §5 (b) / 결정 3.
# cancel 은 가드 약화 아님 — 같은 ref·같은 sha 의 재트리거 중복만 제거 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# 프로젝트 소유 가드 workflow (#907 — 구 harness-guards.yml 재편).
#
# ADR 20260731-907-harness-decouple §결정 5: harness 동기화 디커플로
# 구 동기화 가드 3 스텝을 제거하고 (#907 Phase B — 목록은 ADR §결정 3 참조),
# 프로젝트 가드 6 스텝만 유지한다.
#
# 전 스텝 `hashFiles` 조건 의도적 제거 (#901 흡수, #894 R3 / #896 논리의 전 스텝 일관 적용):
#   종전 `hashFiles(...) != ''` 조건은 "스크립트 미포함 다운스트림에선 조용히 스킵" 이라는
#   upstream 배포 편의였다. 디커플 후 모든 스텝은 본 프로젝트 고유 가드다 — "스크립트 부재"
#   는 배포 시나리오가 아니라 **가드가 삭제된 회귀**이며, 조용히 스킵하면 CI 가 초록인 채
#   가드가 사라진다 (CLAUDE.md §가드 설계 원칙: drift 가드는 fail-fast 만, fallback 분기 금지).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  project-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # agent SSoT drift 가드 (#145)
      # CLAUDE.md `### sub-agent 검증 완료 ≠ GitHub 박제 완료` 의 공통 JSON 스키마 9개 필드가
      # 5개 에이전트 파일의 `## 마무리 체크리스트 JSON 반환` 섹션에 모두 존재하고 선언 순서를
      # 유지하는지 검사. drift 시 exit 1 로 PR 머지 전 차단.
      - name: agent SSoT drift 가드
        run: bash scripts/verify-agent-ssot.sh

      # create-pr SSoT drift 가드 (#480, #477 후속)
      # 5 페르소나 .md (architect/developer/pm/qa/reviewer) 에 박제된
      # "**PR 생성 시 반드시 `create-pr` 스킬 사용**" SSoT 문구의 존재 + 동일성 검증.
      # 한쪽만 갱신 시 drift 발생 → exit 1 로 차단.
      - name: create-pr SSoT drift 가드
        run: bash scripts/verify-create-pr-ssot.sh

      # release version bump 가드
      # chore(release) PR 에서 CHANGELOG 를 업데이트했으나 package.json::version bump 를 누락하는
      # 회귀를 차단. CHANGELOG 최신 `## [X.Y.Z]` 엔트리와 package.json::version 일치 검증.
      - name: release version bump 가드
        run: bash scripts/verify-release-version-bump.sh

      # CLAUDE.md 각인 예산 가드 (#197 Phase 2 → #905 fail-fast 복구 → #907 이설)
      # 45k chars 이상 exit 1 로 감축 PR 을 강제. 33k/40k 는 warn (exit 0). 임계 SSoT = scripts/verify-claudemd-size.mjs
      # 지침: docs/guides/claudemd-governance.md §3 (정량 게이트)
      # self-test 동시 배선 (#897 교훈 — CI 미배선 self-test 는 0회 실행).
      - name: CLAUDE.md 각인 예산 가드 self-test
        run: node scripts/verify-claudemd-size.mjs --self-test
      - name: CLAUDE.md 각인 예산 가드
        run: node scripts/verify-claudemd-size.mjs

      # docs 전체 상대 링크 무결성 가드 (#197 Phase 2 → #842 fail-fast 복구)
      # link rot 위험 증가 — 파일 존재 검증. 검사 범위 계약: scripts/verify-docs-links.mjs 헤더 SSoT.
      - name: docs 상대 링크 무결성 가드
        run: bash scripts/verify-docs-links.sh

      # ADR 인덱스 상태 열 ↔ ADR 실물 대조 가드 (#1005)
      # `docs/decisions/README.md` §인덱스 계약 (2) — "ADR 상태를 전이시키는 PR 이 같은 PR 에서
      # 표를 갱신한다" — 의 강제 지점. 명문화(PR #1004)만 있고 발화 지점이 0 이던 구간에서
      # drift 가 두 번 실측됐다 (#993 전이 PR 이 표를 정의상 열지 않음 / #1015 신규 ADR 미등재).
      # upstream-only 행(로컬 파일 부재)은 제외하되 제외 사실·근거·수동 GET 절차를 stdout 에
      # 명시한다 (silent skip 금지). 범위·토큰 규칙 SSoT = scripts/verify-adr-index.mjs 헤더.
      # self-test 동시 배선 (#897 교훈 — CI 미배선 self-test 는 0회 실행). 도입 시점 drift 가 0 이라
      # 본검사 PASS 는 작동 증거가 아니다 — 증거는 F1~F20 격리 픽스처 쪽이다.
      - name: ADR 인덱스 상태 대조 가드 self-test
        run: node scripts/verify-adr-index.mjs --self-test
      - name: ADR 인덱스 상태 대조 가드
        run: node scripts/verify-adr-index.mjs

      # 브랜치명 규약 SSoT drift 가드 (#962 축 B)
      # `scripts/verify-branch-name.mjs` 의 상수가 브랜치 규약의 **정본**이고, 산문 3곳
      # (PULL_REQUEST_TEMPLATE.md / developer.md / create-pr/SKILL.md) 의 type 열거는 그
      # 파생이다. 한쪽만 갱신하면 drift → exit 1 로 차단. 추가로 workflow 의 `branch:`
      # 리터럴(봇 브랜치 생성 지점)이 전부 허용 집합으로 설명되는지 검사해, 3번째 봇 패턴이
      # 등장하는 순간 의식적 갱신을 강제한다 (통째 skip 으로 무마 금지 — fail-fast 정합).
      # 5단계로 `docs/guides/branch-strategy-workflow.md` §허용 집합 표 4행도 대조한다
      # (reviewer 권고 R1 — 그 표는 type 열거뿐 아니라 gitflow head / 릴리스 형태 / 봇
      # 리터럴까지 축자 재기술하므로, 검증 밖에 두면 상수 변경 시 조용히 drift 한다).
      #
      # 추출 계약 D1 정정 (2026-08-06 실측, ADR §5-4 / 스크립트 ENUM_RE 주석과 3중 박제):
      #   원안 "해당 라인의 백틱 인용 토큰만 추출" 을 **라인 전체**로 해석하면
      #   `base=develop` / `<type>/*` / `--squash` 같은 잉여 토큰이 유입돼 3파일 전부
      #   양방향 대조가 **상시 false-fire** 한다. 따라서 추출 범위를 locator 이후의
      #   **열거 구간**(`` `type` `` + 선택적 `(alias)` + ` / ` 반복의 최장 선두 run)으로
      #   한정한다. 원안의 의도(백틱 범위 한정이 `feat` 를 배제)는 실측으로 확인됐다.
      #   **대가 (의도적 미대응)**: 열거 구간 **밖**에 추가된 type 토큰은 미검출이다.
      #   하드닝하면 `create-pr/SKILL.md` 의 `` `develop` `` 이 같은 패턴이라 D1 이 제거한
      #   상시 false-fire 가 즉시 재유입된다. 실제 drift 편집 경로는 전부 잡히므로 지불한다.
      #
      # 런타임 브랜치명 검사는 `branch-name-guard.yml` 이 담당한다 (선결 조건이 다름 —
      # 이 워크플로는 이벤트 무관 정적 검사라는 불변식을 유지).
      - name: 브랜치명 규약 SSoT drift 가드
        run: node scripts/verify-branch-name.mjs --verify-ssot
      # self-test 동시 배선 (#897 교훈 — CI 미배선 self-test 는 0회 실행).
      # 자식 프로세스 프로브 4건 포함 — 진입점 silent no-op(D-negative) 1건 +
      # CLI 인자 파싱 우회(reviewer B1) 3건. 후자는 `--branch '--self-test'` 처럼 모드
      # 플래그가 값으로 왔을 때 브랜치 검사가 건너뛰어지지 않는지를 CI 로그에 남긴다.
      - name: 브랜치명 규약 가드 self-test
        run: node scripts/verify-branch-name.mjs --self-test

      # PR base 선택 규칙 SSoT drift 가드 (#970 — 축 B 후속 F1)
      # `scripts/verify-pr-base-rule.mjs` 의 `BASE_RULES` 매트릭스가 base 규칙의 **정본**이고,
      # `docs/guides/branch-strategy-workflow.md` §base 선택 규칙 표는 그 파생이다.
      # 대조는 **양방향**이다 — 표의 각 행 예시를 런타임 판정기(`classifyPair`)로 돌리는
      # 방향(→)만 두면, 정본에 base shape 를 **추가**했을 때 표가 조용히 뒤처진다. 그래서
      # `BASE_RULES` 의 모든 키가 표에 정확히 한 행씩 등장하는지(←)도 함께 본다.
      # 런타임 base×head 검사는 `branch-name-guard.yml` 이 담당한다 (선결 조건이 다름 —
      # 이 워크플로는 이벤트 무관 정적 검사라는 불변식을 유지).
      - name: PR base 선택 규칙 SSoT drift 가드
        run: node scripts/verify-pr-base-rule.mjs --verify-ssot
      # self-test 동시 배선 (#897 교훈 — CI 미배선 self-test 는 0회 실행).
      # 픽스처 맨 앞 4건은 **릴리스·핫픽스 셀**이다. 본 가드는 `branch-name` job 에 배선되고
      # 그 job 은 `main` 의 required status check (`enforce_admins: true`) 이므로, 그 4셀에서
      # 오차단이 나면 릴리스가 하드 블록된다 — 실환경 negative 실증이 불가능한 셀이라
      # (release PR 을 일회용으로 만들 수 없다) 이 픽스처가 유일한 상시 방어선이다.
      # 자식 프로세스 프로브 12건 포함 — 진입점 silent no-op 1건 + CLI 인자 파싱 11건
      # (모드 플래그가 값으로 위장 / 두 모드 병합 / 라벨 중복·누락·위치인자 / 프로토타입 오염 /
      #  빈 값 3종 → exit 2 + **대조군 1종** → exit 1). 마지막 쌍은 종료 코드를 구분해 단언한다 —
      # exit 1 과 2 가 둘 다 non-zero 라 "실패했다" 로 뭉뚱그리면 회귀를 못 잡는다 (#1023 reviewer).
      - name: PR base 선택 규칙 가드 self-test
        run: node scripts/verify-pr-base-rule.mjs --self-test

      # PR 템플릿 체크리스트 가드 self-test (#1010)
      # `pr-template-checklist-guard.yml` 은 PR 본문(네트워크·이벤트 의존)을 재므로 판정식
      # 자체의 회귀를 못 잡는다. 격리 픽스처 F1~F9 는 여기서 결정적으로 돈다
      # (#897 교훈 — CI 미배선 self-test 는 0회 실행).
      # F1 은 `.github/PULL_REQUEST_TEMPLATE.md` 원문을 base 로 쓰므로, 템플릿이 7 키워드
      # phrase 를 잃는 drift (#855 `Test plan` 3자 drift — failure run 76건 중 40건의 원인)
      # 가 여기서 즉시 FAIL 로 드러난다.
      - name: PR 템플릿 체크리스트 가드 self-test
        run: node scripts/verify-pr-template-checklist.mjs --self-test

      # docs/lessons/ README 동기화 가드 (#213)
      # 신규 레슨 파일이 README "파일 목록" 표에 등록되지 않으면 exit 1 로 PR 머지 차단.
      - name: docs/lessons README 동기화 가드
        run: bash scripts/verify-lessons-readme.sh

      # SSoT ↔ 사본 트리거 문언 동일 가드 (#1076)
      # operational-friction.md §8 의 트리거 강조 span 을 런타임 추출해 `.claude/agents/developer.md`
      # 사본과 정규화 축자 대조 + 규범면 보유 파일 집합 pin. #1062 가 낸 낱말 drift(`해석하는` ↔
      # `의존하는`)를 그대로 재현하면 exit 1 이다. 문언 리터럴은 스크립트에 없다 (세 번째 사본 방지).
      # self-test 동시 배선 (#897 교훈 — CI 미배선 self-test 는 0회 실행).
      - name: SSoT 트리거 문언 가드 self-test
        run: node scripts/verify-ssot-trigger-wording.mjs --self-test
      - name: SSoT 트리거 문언 가드
        run: node scripts/verify-ssot-trigger-wording.mjs
