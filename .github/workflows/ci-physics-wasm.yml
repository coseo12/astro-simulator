name: CI (physics-wasm)

# 프로젝트 로컬 워크플로 — harness 업데이트 대상 아님.
# Rust/wasm-pack 툴체인과 workspace 테스트 커버리지 가드를 담당한다.
# harness가 관리하는 ci.yml 과 분리되어, 템플릿 업데이트 시 충돌을 방지한다.

# 같은 sha 의 push+PR 중복 run 제거 (#779). group 에 github.workflow 포함 →
# 워크플로 간 교차 취소 방지. PR head sha == 머지 후 push sha 로 수렴 → 같은 sha 묶임.
# cancel 은 가드 약화 아님 — 동일 코드를 검증하는 중복 run 중 하나만 남김 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# #845 — wasm-pack 버전 단일 선언 (workflow 내 SSoT). rust-toolchain.toml 은 cargo 툴체인만
# 커버하므로 wasm-pack 은 env 로 묶는다 (과설계 금지 — 파일 간 SSoT 는 composite action
# `setup-and-build` 의 input default 가 별도 담당).
env:
  WASM_PACK_VERSION: '0.14.0'

jobs:
  verify-and-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 모든 워크스페이스에 Vitest 설정 존재 강제 (조용히 스킵되는 테스트 방지)
      - name: verify:test-coverage
        if: hashFiles('scripts/verify-test-coverage.mjs') != ''
        run: node scripts/verify-test-coverage.mjs

      # P10-B-3 #274 — IAU 2015 데이터 회귀 차단 게이트.
      # packages/shared/data/solar-system.json 이 IAU/NASA/JPL 공식값 ±0.01% 공차를
      # 벗어나거나 감사 필드 (dataSource / lastVerified / colorSource) 가 누락되면 exit 1.
      # 순수 Node.js (의존성 없음) 이므로 pnpm install 이전 실행 가능.
      - name: verify:iau-data (Fact-First 원칙 §2 공차 게이트)
        if: hashFiles('scripts/verify-iau-data.mjs') != ''
        run: node scripts/verify-iau-data.mjs

      # Rust + WASM 툴체인 (packages/physics-wasm)
      # #845 — 툴체인 버전 SSoT = rust-toolchain.toml (channel). dtolnay action 은 toml 을
      # 자동 인식하지 않으므로 (toolchain input 필수 — action.yml 실측) 추출 스텝으로 주입.
      # 추출 실패 시 빈 값 → 명시 exit 1 (fail-fast, fallback 분기 금지 — 가드 설계 원칙).
      - name: Rust 툴체인 채널 추출 (rust-toolchain.toml SSoT)
        id: rust-toolchain
        if: hashFiles('rust-toolchain.toml') != ''
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml 에서 channel 추출 실패"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Rust 툴체인 설정
        if: hashFiles('rust-toolchain.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # Rust 빌드 캐시 — cargo registry + target/ 재사용 (cargo test --release 단축)
      - name: Rust 빌드 캐시
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm

      # #843 — Rust 품질 게이트. 기존엔 rustfmt/clippy 를 components 로 설치만 하고
      # 실행 스텝이 없어 경고 11건 + fmt 29 hunk 가 조용히 누적됐다
      # ("CI 통과 ≠ 테스트 실행" 교훈의 lint 변형). 테스트 스텝 앞 배치로 빠른 fail.
      # fmt 는 컴파일 불필요 (수 초), clippy 는 rust-cache 재사용. -D warnings 로 경고=실패.
      - name: Rust fmt 게이트 (physics-wasm)
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        run: cargo fmt --check --manifest-path packages/physics-wasm/Cargo.toml

      - name: Rust clippy 게이트 (physics-wasm, -D warnings)
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        run: cargo clippy --all-targets --manifest-path packages/physics-wasm/Cargo.toml -- -D warnings

      # wasm-pack: cargo install(≈60~70s) → prebuilt 바이너리로 대체
      - name: wasm-pack 설치
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          # #845 — 버전은 workflow top-level env WASM_PACK_VERSION 단일 선언.
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      # 1000년 심플렉틱 적분(365250 step)은 release 모드에서만 빠름.
      # P9 #254 M4: 장기 적분 테스트(수성/금성/지구 근일점 EIH 6건 + Laplace 공명
      # 2건)는 `#[ignore = "long-integration"]` 로 분리됐다. 빠른 경로는 이를 스킵
      # 하여 PR 피드백 < 5분을 유지한다. 장기 경로는 아래 long-integration job.
      - name: Rust 테스트 (physics-wasm, 빠른 경로)
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        run: cargo test --release --manifest-path packages/physics-wasm/Cargo.toml -- --nocapture

      # #840 — 단위 테스트 (vitest, 전 워크스페이스 94파일 — shared 1 + core 51 + web 41 + wasm 1 실측) CI 배선.
      # 구 ci.yml 'pnpm run --if-present test' 는 bb220d3 (2026-04-20) 루트 test→test:unit
      # 리네임 후 silent no-op 으로 약 3개월 미실행 ("CI 통과 ≠ 테스트 실행" 자기 재발).
      # 본 job 배선 근거: core 소스 4파일이 @astro-simulator/physics-wasm (pkg/, gitignored)
      # 을 직접 import → wasm-pack 빌드 선행 필수 — Rust 툴체인 보유 job 이 유일한 저비용 지점.
      # shared/core 는 exports 가 dist/ 기반 (gitignored) 이라 tsc 빌드도 선행한다.
      # composite setup-and-build 미사용 (리뷰 발견): composite 는 Playwright 설치 +
      # 루트 `pnpm build` (web next build 포함) 를 무조건 수행 — vitest 에 불필요한 비용.
      # 인라인 3스텝 + 표적 빌드로 대체. Node 핀은 .node-version (#666 전수 명시 핀 정합).
      - name: pnpm setup (unit tests)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4

      - name: Node.js setup (unit tests)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: pnpm install (unit tests)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: workspace 빌드 (wasm → shared → core)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm --filter @astro-simulator/physics-wasm build
          pnpm --filter @astro-simulator/shared --filter @astro-simulator/core -r build

      # 실행 테스트 수 > 0 단언 — silent no-op 재발 차단 (#840 가드).
      # NO_COLOR: vitest ANSI 컬러 억제 (PR #866 리뷰 실측 — 컬러가 토큰 매칭을 깬다).
      # awk 는 ANSI strip 후 정규식 match (필드 비의존) — NO_COLOR 미작동 환경 belt-and-braces.
      # 합산은 단일 awk (항상 exit 0) — pipefail/bash -e 하에서 단언 경로가 죽지 않도록
      # 명령 치환 내부 파이프라인을 배제한다. 'Tests  N passed' 만 매칭 ('Test Files' 제외).
      - name: 단위 테스트 (vitest) + 실행 수 단언
        if: hashFiles('pnpm-lock.yaml') != ''
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm -r test 2>&1 | tee /tmp/vitest-out.log
          TOTAL=$(awk '{ gsub(/\033\[[0-9;]*m/, ""); if (match($0, /Tests[[:space:]]+[0-9]+[[:space:]]+passed/)) { t = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", t); s += t } } END { print s + 0 }' /tmp/vitest-out.log)
          echo "실행 테스트 합계: ${TOTAL}"
          if [ "${TOTAL}" -lt 1 ]; then
            echo "::error::단위 테스트 실행 0건 — silent no-op 재발 (#840 가드)"
            exit 1
          fi

  # P9 #254 M4 — 장기 적분 테스트 분리 경로.
  # `#[ignore = "long-integration"]` 로 마킹된 테스트만 실행 (수성/금성/지구 근일점
  # EIH 6건 + Laplace 공명 D5-a 1건). CPU 집약 테스트를 빠른 경로와 분리해 PR
  # 피드백 5분 목표 달성 + 장기 경로는 별도 job 으로 병렬 실행.
  # 실패 시에도 빠른 경로 PASS 면 PR 차단되지 않음 — 장기 경로는 별도 관찰용.
  long-integration-rust:
    runs-on: ubuntu-latest
    # 병렬 실행 (빠른 경로 + 장기 경로 독립).
    steps:
      - uses: actions/checkout@v4

      # #845 — 툴체인 버전 SSoT = rust-toolchain.toml (verify-and-rust job 과 동형 추출).
      - name: Rust 툴체인 채널 추출 (rust-toolchain.toml SSoT)
        id: rust-toolchain
        if: hashFiles('rust-toolchain.toml') != ''
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml 에서 channel 추출 실패"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Rust 툴체인 설정
        if: hashFiles('rust-toolchain.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust 빌드 캐시
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm
          # 빠른 경로와 다른 캐시 키 — 동시 빌드 충돌 방지.
          key: long-integration

      # `--include-ignored` 로 ignore 테스트만 실행하려면 `--ignored` 필요.
      # `--include-ignored` 는 전체 실행. 여기서는 ignore 된 것만 실행해 시간 절약.
      - name: Rust 장기 적분 테스트 (physics-wasm, ignored only)
        if: hashFiles('packages/physics-wasm/Cargo.toml') != ''
        run: cargo test --release --manifest-path packages/physics-wasm/Cargo.toml -- --ignored --nocapture
        # 장기 경로 실패는 머지 차단하지 않음 — CI 로그 관찰용.
        continue-on-error: true

  # P6-E #193 (E4) — 신규 함수 중복 방지 가드 (warn-only).
  # ADR: docs/decisions/20260417-duplicate-function-guard.md
  # pre-commit 우회 시 PR diff 로 재검사. exit 0 기본 (머지 차단 X).
  duplicate-function-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base 대비 diff 필요

      - uses: actions/setup-node@v4
        with:
          # #666 (Amendment 4) — 정확 버전 중앙 파일 일원화 (기존 node-version: 20).
          #   playwright 미사용 (deadlock 무관) 이나 SSoT 완성을 위해 동반 전환.
          node-version-file: '.node-version'

      - name: 가드 회귀 테스트 (픽스처 3종)
        run: node scripts/check-duplicate-functions.test.mjs

      - name: 중복 함수 가드 (PR diff)
        if: github.event_name == 'pull_request'
        run: node scripts/check-duplicate-functions.mjs --base origin/${{ github.base_ref }}
