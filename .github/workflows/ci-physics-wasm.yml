name: CI (physics-wasm)

# 프로젝트 로컬 워크플로 — harness 업데이트 대상 아님.
# Rust/wasm-pack 툴체인과 workspace 테스트 커버리지 가드를 담당한다.
# harness가 관리하는 ci.yml 과 분리되어, 템플릿 업데이트 시 충돌을 방지한다.

# ── hashFiles silent-skip 정책 (#950) — SSoT 는 ci.yml §hashFiles silent-skip 정책 블록 (#945) ──
# 요지: **가드 대상 파일의 존재를 실행 조건으로 걸지 않는다.** 부재 시 실행 명령이
#   ENOENT / 명시 exit 1 로 즉시 FAIL 하는 것이 유일한 정상 동작이다
#   (CLAUDE.md §가드 설계 원칙 — drift 가드는 fail-fast 만, fallback 분기 금지).
# 본 파일의 `if: hashFiles(...) != ''` **19곳을 전량 제거**했다. 조건이 참조하던 대상 5종
#   (rust-toolchain.toml / packages/physics-wasm/Cargo.toml / pnpm-lock.yaml /
#   scripts/verify-test-coverage.mjs / scripts/verify-iau-data.mjs) 은 `git ls-files`
#   전수 실측 (2026-08-04) 에서 **전부 tracked** 라 조건이 상시 참이었다 — 즉 "부재" 는
#   배포 시나리오가 아니라 **가드가 삭제된 회귀**이고, 조용히 스킵하면 CI 가 초록인 채
#   Rust 툴체인·fmt·clippy·cargo test·vitest 전 경로가 통째로 사라진다
#   (#840 "CI 통과 ≠ 테스트 실행" 클래스 / #338 영구 silent skip 실사례).
# 선례 정합: #901/#915 (project-guards.yml 전 스텝) → #885 (ci.yml 기동·정리) →
#   #945 (ci.yml 전량, 예외 0) → 본 변경 (잔여 워크플로). 동형이며 같은 근거.
# **예외 0** — 런타임 생성 산출물의 "부재 정상" 은 조건이 아니라 액션 옵션으로 표현한다
#   (본 파일엔 해당 사례 없음. bench.yml 의 `ignore_empty` 참조).

# 중복 run 제거 (#779). group 에 github.workflow 포함 → 워크플로 간 교차 취소 방지.
# group 에 github.ref 포함 (#971 Phase 0) → pull_request(refs/pull/N/merge) 와 push(refs/heads/*)
#   가 별도 group. 같은 sha 의 push↔PR 교차 취소와 ff-sync 의 main↔develop 교차 취소가 소멸한다
#   (required check 하에서 cancelled 는 미통과 결론 = 릴리스 하드 블록). SSoT: ADR
#   docs/decisions/20260807-971-required-status-checks.md §2-7 / §5 (b) / 결정 3.
# cancel 은 가드 약화 아님 — 같은 ref·같은 sha 의 재트리거 중복만 제거 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# #845 — wasm-pack 버전 단일 선언 (workflow 내 SSoT). rust-toolchain.toml 은 cargo 툴체인만
# 커버하므로 wasm-pack 은 env 로 묶는다 (과설계 금지 — 파일 간 SSoT 는 composite action
# `setup-and-build` 의 input default 가 별도 담당).
env:
  WASM_PACK_VERSION: '0.14.0'

jobs:
  # #915 범위 1 — diff-scope 판별 선행 job (docs-only 시 무거운 job 스킵).
  # 분류 SSoT + 판별 단위/required check 전제 주석: ci.yml diff-scope job 참조 (패턴 원본).
  # 본 workflow 의 3 job (Rust/wasm/vitest/중복함수) 은 전부 코드 검증 — docs/**·*.md·.claude/**
  # 만의 변경으로는 깨질 수 없어 job 단위 통스킵이 안전하다 (ci.yml 과 달리 상시 스텝 없음).
  diff-scope:
    # #971 Phase 0 (결정 6-2) — 체크런 이름을 `diff-scope-wasm` 으로 분리한다. ci.yml 의 job id 도
    #   `diff-scope` 라 두 워크플로가 **동명 체크런**을 만들고, required status check 는 이름
    #   문자열로 매칭되므로 GitHub 이 명시 경고한 "ambiguous status check results" 에 해당한다
    #   (ADR 20260807-971-required-status-checks §2-5 workflow 축 / §2-2).
    # job **id** 는 유지 — 아래 `needs: diff-scope` 3곳 (verify-and-rust / long-integration-rust /
    #   duplicate-function-guard) 과 `needs.diff-scope.outputs.*` 참조가 id 를 쓰므로 무접촉이다.
    # ⚠ event 축 (`pull_request` + `push`) ×2 는 남는다 — 본 리네임은 동명 "해소" 가 아니라
    #   "축소" 다 (4 → 2 + 2). ADR §2-11 참조.
    name: diff-scope-wasm
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: 분류기 self-test (사용 직전 자기 검증)
        run: node scripts/ci-diff-scope.mjs --self-test

      - name: 변경 파일 판별 + 분류
        id: scope
        run: |
          # depth-1 checkout + 표적 fetch — 실패 시 빈 목록 → fail-safe code_changed=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
            else
              echo "::warning::base sha fetch 실패 — fail-safe: 전체 코드 취급"
              : > /tmp/changed-files.txt
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
              git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed-files.txt
            else
              echo "::warning::push before sha 미해석 (신규 브랜치/force-push) — fail-safe: 전체 코드 취급"
              : > /tmp/changed-files.txt
            fi
          fi
          echo "── 변경 파일 목록 ──"
          cat /tmp/changed-files.txt
          node scripts/ci-diff-scope.mjs --files-from /tmp/changed-files.txt

  verify-and-rust:
    runs-on: ubuntu-latest
    # #915 — docs-only 스킵. skip 이 머지를 막지 않는다 (결론 불변, 전제는 #970 에서 정정).
    # ⚠ 종전 이 자리의 전제 *"required check 미설정 실측"* 은 2026-08-08 이후 **거짓**이다
    #   (#971 Phase 1 적용). 정정된 전제 2겹 — 실측 2026-08-12 `GET /branches/main/protection`:
    #   ① 본 workflow 의 체크런(`diff-scope-wasm` / `verify-and-rust` 등) 은 required 3종
    #      `["project-guards","branch-name","label-pr"]` 에 **없다**.
    #   ② 설령 required 가 되어도 **job 단위** 스킵(`if:` false / `needs` 실패)은 `skipped` 로
    #      보고되고 이는 통과 3종(success/skipped/neutral)에 든다 — 영구 pending 을 만드는 것은
    #      **workflow 단위** 스킵(`paths` 필터)뿐이다 (ADR 20260807-971 §2-2).
    #   위임처 ci.yml diff-scope job 주석이 같은 정정본을 갖는다 (#971 회수).
    needs: diff-scope
    if: needs.diff-scope.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      # 모든 워크스페이스에 Vitest 설정 존재 강제 (조용히 스킵되는 테스트 방지)
      - name: verify:test-coverage
        run: node scripts/verify-test-coverage.mjs

      # P10-B-3 #274 — IAU 2015 데이터 회귀 차단 게이트.
      # packages/shared/data/solar-system.json 이 IAU/NASA/JPL 공식값 ±0.01% 공차를
      # 벗어나거나 감사 필드 (dataSource / lastVerified / colorSource) 가 누락되면 exit 1.
      # 순수 Node.js (의존성 없음) 이므로 pnpm install 이전 실행 가능.
      - name: verify:iau-data (Fact-First 원칙 §2 공차 게이트)
        run: node scripts/verify-iau-data.mjs

      # Rust + WASM 툴체인 (packages/physics-wasm)
      # #845 — 툴체인 버전 SSoT = rust-toolchain.toml (channel). dtolnay action 은 toml 을
      # 자동 인식하지 않으므로 (toolchain input 필수 — action.yml 실측) 추출 스텝으로 주입.
      # 추출 실패 시 빈 값 → 명시 exit 1 (fail-fast, fallback 분기 금지 — 가드 설계 원칙).
      - name: Rust 툴체인 채널 추출 (rust-toolchain.toml SSoT)
        id: rust-toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml 에서 channel 추출 실패"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Rust 툴체인 설정
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # Rust 빌드 캐시 — cargo registry + target/ 재사용 (cargo test --release 단축)
      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm

      # #843 — Rust 품질 게이트. 기존엔 rustfmt/clippy 를 components 로 설치만 하고
      # 실행 스텝이 없어 경고 11건 + fmt 29 hunk 가 조용히 누적됐다
      # ("CI 통과 ≠ 테스트 실행" 교훈의 lint 변형). 테스트 스텝 앞 배치로 빠른 fail.
      # fmt 는 컴파일 불필요 (수 초), clippy 는 rust-cache 재사용. -D warnings 로 경고=실패.
      - name: Rust fmt 게이트 (physics-wasm)
        run: cargo fmt --check --manifest-path packages/physics-wasm/Cargo.toml

      # #877 — `--all-features` 추가. 기본 feature 만 검사하면 `diagnostics` gated 코드
      # (nbody.rs diag_* 12건 + geodesic.rs 1건) 가 compile 제외라 lint CI 사각이었다.
      # 본 crate 에 `cfg(not(feature = ...))` 코드가 0건이므로 `--all-features` 는 기본
      # 구성의 **순수 상위집합** — 커버리지 손실 없이 사각만 제거한다.
      # 비용 실측 (냉시작, cargo clean 후): 기본 5.47s vs --all-features 5.05s
      # → 차이는 측정 노이즈 범위 (진단 코드 13개 함수 추가 lint 는 사실상 무비용). 도입.
      - name: Rust clippy 게이트 (physics-wasm, -D warnings, --all-features)
        run: cargo clippy --all-targets --all-features --manifest-path packages/physics-wasm/Cargo.toml -- -D warnings

      # wasm-pack: cargo install(≈60~70s) → prebuilt 바이너리로 대체
      - name: wasm-pack 설치
        uses: taiki-e/install-action@v2
        with:
          # #845 — 버전은 workflow top-level env WASM_PACK_VERSION 단일 선언.
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      # 1000년 심플렉틱 적분(365250 step)은 release 모드에서만 빠름.
      # P9 #254 M4: 장기 적분 테스트(수성/금성/지구 근일점 EIH 6건 + Laplace 공명
      # 2건)는 `#[ignore = "long-integration"]` 로 분리됐다. 빠른 경로는 이를 스킵
      # 하여 PR 피드백 < 5분을 유지한다. 장기 경로는 아래 long-integration job.
      - name: Rust 테스트 (physics-wasm, 빠른 경로)
        run: cargo test --release --manifest-path packages/physics-wasm/Cargo.toml -- --nocapture

      # #840 — 단위 테스트 (vitest, 전 워크스페이스 94파일 — shared 1 + core 51 + web 41 + wasm 1 실측) CI 배선.
      # 구 ci.yml 'pnpm run --if-present test' 는 bb220d3 (2026-04-20) 루트 test→test:unit
      # 리네임 후 silent no-op 으로 약 3개월 미실행 ("CI 통과 ≠ 테스트 실행" 자기 재발).
      # 본 job 배선 근거: core 소스 4파일이 @astro-simulator/physics-wasm (pkg/, gitignored)
      # 을 직접 import → wasm-pack 빌드 선행 필수 — Rust 툴체인 보유 job 이 유일한 저비용 지점.
      # shared/core 는 exports 가 dist/ 기반 (gitignored) 이라 tsc 빌드도 선행한다.
      # composite setup-and-build 미사용 (리뷰 발견): composite 는 Playwright 설치 +
      # 루트 `pnpm build` (web next build 포함) 를 무조건 수행 — vitest 에 불필요한 비용.
      # 인라인 3스텝 + 표적 빌드로 대체. Node 핀은 .node-version (#666 전수 명시 핀 정합).
      - name: pnpm setup (unit tests)
        uses: pnpm/action-setup@v4

      - name: Node.js setup (unit tests)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: pnpm install (unit tests)
        run: pnpm install --frozen-lockfile

      - name: workspace 빌드 (wasm → shared → core)
        run: |
          pnpm --filter @astro-simulator/physics-wasm build
          pnpm --filter @astro-simulator/shared --filter @astro-simulator/core -r build

      # #1060 — packages/{shared,core} 테스트 파일 타입 검사 강제 지점.
      # 두 패키지의 build (`tsc -p tsconfig.build.json`) 는 exclude 로 `**/*.test.ts` ·
      #   `**/__test-utils__/**` 를 빼고, 이를 포함하는 것은 `typecheck` (`tsc --noEmit`,
      #   tsconfig.json = include ["src/**/*"]) 뿐인데 이를 부르는 CI 스텝이 0개였다.
      #   vitest 는 트랜스파일만 하고 타입을 안 보므로 아래 단위 테스트 스텝도 못 잡는다
      #   → 58 파일이 타입 검사 사각 ("CI 통과 ≠ 테스트 실행" #840 클래스, 강제 지점 부재형).
      # 배선 지점이 여기인 이유: 위 빌드 스텝의 선행 조건 논거(core 소스가 physics-wasm 산출물을
      #   직접 import / shared·core exports 가 dist/ 기반, 둘 다 gitignored)가 typecheck 에도
      #   적용된다. 같은 파일 집합의 두 검증(실행·타입)을 한 job 이 소유한다.
      #   ⚠ 단 physics-wasm 갈래는 **요구 산출물이 다르다** (PR #1090 reviewer 실측). core 의
      #   moduleResolution 이 `bundler` 라 exports 의 `node` 조건을 타지 않아, typecheck 이
      #   해석하는 것은 `pkg-bundler/` 이고 `pkg/` 는 vitest 런타임 대상이다 — `pkg/` 만 지우면
      #   core typecheck 은 exit 0 (같은 상태 vitest 는 exit 1), `pkg-bundler/` 를 지워야
      #   TS2307 이 난다. 배선 순서 결론은 불변이다: 위 빌드 스텝이 build:node && build:bundler
      #   로 둘 다 만들고, shared/dist 갈래(제거 시 exit 2)만으로도 이 위치는 필연이기 때문이다.
      # ⚠ 명령 형태는 **패키지별 분리 호출 + --fail-if-no-match** 여야 한다 (둘 중 하나만으로는
      #   안 된다). 커버리지를 조용히 잃는 회귀가 2축이고, 두 수단이 순차 의존이기 때문이다
      #   — 아래는 이 브랜치에서 pnpm 10.32.1 (packageManager 핀과 일치 확인) 로 8셀 전건 실측:
      #     · 축 1 = scripts.typecheck 소실 — 이중 `--filter` 단일 호출은 한쪽 패키지의 스크립트가
      #       사라져도 exit 0 으로 조용히 스킵한다. `--fail-if-no-match` 를 붙여도 여전히 exit 0
      #       이다 (그 플래그는 스크립트 유무를 보지 않는다). **분리 호출**만이 exit 1
      #       (ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT).
      #     · 축 2 = 패키지 리네임/삭제로 필터가 안 맞음 — ⚠ `--fail-if-no-match` 는 **선택 집합
      #       전체가 빌 때만** 발화한다. 즉 이중 `--filter` 에서 한쪽만 사라지면 나머지가 매칭되어
      #       "No projects matched the filters ..." 를 찍고도 **exit 0** 이다. 분리하면 그 부분
      #       미매칭이 각 호출의 전체 미매칭으로 환원되어 비로소 플래그가 exit 1 을 낸다.
      #   ⇒ 분리 호출이 축 1 을 닫고, 그래야 플래그가 축 2 에서 발화한다. 이중 형태에서는 플래그가
      #     양축 모두 무력하다. (#945 hashFiles silent-skip 정책과 같은 클래스 — 가드 대상의 부재는
      #     배포 시나리오가 아니라 가드가 삭제된 회귀다.)
      #   분리 호출의 검출력은 pnpm 메이저에 종속된다 (9.15.4 는 축 1 에서도 exit 0 — ADR §후보
      #   비교 2). SSoT 는 루트 package.json 의 packageManager 필드이며, 그 메이저가 바뀌면 재측정.
      # 두 줄은 `bash -e` 러너에서 첫 줄 실패 시 즉시 중단 = 의도한 fail-fast.
      # SSoT: docs/decisions/20260814-1060-packages-test-typecheck.md 결정 2·3
      #   (결정 3 은 본 스텝에 한정되지 않는 일반 규약 — pnpm 기반 CI 가드 배선 전반에 적용).
      # apps/web (45 파일) · physics-wasm (1) 결손은 본 스텝 범위 밖 — 후속 #1082.
      - name: 'packages 타입 검사 (테스트 파일 포함, #1060)'
        run: |
          pnpm --fail-if-no-match --filter @astro-simulator/shared typecheck
          pnpm --fail-if-no-match --filter @astro-simulator/core typecheck

      # 실행 테스트 수 > 0 단언 — silent no-op 재발 차단 (#840 가드).
      # NO_COLOR: vitest ANSI 컬러 억제 (PR #866 리뷰 실측 — 컬러가 토큰 매칭을 깬다).
      # awk 는 ANSI strip 후 정규식 match (필드 비의존) — NO_COLOR 미작동 환경 belt-and-braces.
      # 합산은 단일 awk (항상 exit 0) — pipefail/bash -e 하에서 단언 경로가 죽지 않도록
      # 명령 치환 내부 파이프라인을 배제한다. 'Tests  N passed' 만 매칭 ('Test Files' 제외).
      - name: 단위 테스트 (vitest) + 실행 수 단언
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm -r test 2>&1 | tee /tmp/vitest-out.log
          TOTAL=$(awk '{ gsub(/\033\[[0-9;]*m/, ""); if (match($0, /Tests[[:space:]]+[0-9]+[[:space:]]+passed/)) { t = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", t); s += t } } END { print s + 0 }' /tmp/vitest-out.log)
          echo "실행 테스트 합계: ${TOTAL}"
          if [ "${TOTAL}" -lt 1 ]; then
            echo "::error::단위 테스트 실행 0건 — silent no-op 재발 (#840 가드)"
            exit 1
          fi

  # P9 #254 M4 — 장기 적분 테스트 분리 경로.
  # `long_` 접두 + `#[ignore]` 로 마킹된 테스트만 실행 (수성/금성/지구 근일점
  # EIH 6건 + Laplace 공명 D5-a 1건). CPU 집약 테스트를 빠른 경로와 분리해 PR
  # 피드백 5분 목표 달성 + 장기 경로는 별도 job 으로 병렬 실행.
  # 실패 시에도 빠른 경로 PASS 면 PR 차단되지 않음 — 장기 경로는 별도 관찰용.
  #
  # #877 — `--ignored` 전체 실행에서 `--ignored long_` 필터로 전환. 기존엔 CI 실행
  # 의도가 없는 `#[ignore]` 2건까지 딸려 실행됐다:
  #   - diagnose_laplace_window_sweep — 주석이 "CI 에선 실행 안 함" 을 선언했는데도
  #     실행 (주석 계약 ↔ 구현 drift). n ∈ {50..2000} Io 주기 sweep = 3850 주기 적분
  #   - test_laplace_phase_amplitude_2deg_scope_deferred — assertion 0 (#282 대기).
  #     100 Io 주기를 적분하고 아무것도 검증하지 않는 공허 PASS
  # `long_` 접두는 "CI 장기 경로에서 실행됨" 을 이름 자체로 선언하는 계약이다.
  # 신규 장기 적분 테스트 추가 시 `long_` 을 붙여야 CI 가 집어간다.
  long-integration-rust:
    runs-on: ubuntu-latest
    # 병렬 실행 (빠른 경로 + 장기 경로 독립). #915 — docs-only 스킵 (diff-scope 게이트).
    needs: diff-scope
    if: needs.diff-scope.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      # #845 — 툴체인 버전 SSoT = rust-toolchain.toml (verify-and-rust job 과 동형 추출).
      - name: Rust 툴체인 채널 추출 (rust-toolchain.toml SSoT)
        id: rust-toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "${channel}" ]; then
            echo "::error::rust-toolchain.toml 에서 channel 추출 실패"
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Rust 툴체인 설정
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm
          # 빠른 경로와 다른 캐시 키 — 동시 빌드 충돌 방지.
          key: long-integration

      # #877 선택 가드 — `long_` 이 0건을 매칭해도 libtest 는 exit 0 (silent no-op).
      # 아래 실행 스텝은 continue-on-error 라 배선 붕괴가 조용히 초록으로 통과한다.
      # 따라서 선택 건수 단언만 별도 스텝 (continue-on-error 없음) 으로 분리해 fail-fast.
      # "CI 통과 ≠ 테스트 실행" 의 재발 차단 (#840 실행 수 단언 가드와 동형).
      # `--list` 는 실행 없이 선택만 출력 — release 컴파일은 다음 스텝과 공유되어 추가 비용 ~0.
      - name: 장기 적분 테스트 선택 가드 (long_ 매칭 ≥ 1)
        run: |
          set -o pipefail
          cargo test --release --manifest-path packages/physics-wasm/Cargo.toml \
            -- --ignored long_ --list 2>&1 | tee /tmp/long-list.log
          SELECTED=$(grep -c ': test$' /tmp/long-list.log || true)
          echo "선택된 장기 적분 테스트: ${SELECTED}"
          if [ "${SELECTED}" -lt 1 ]; then
            echo "::error::long_ 필터 매칭 0건 — 테스트 이름 규약 drift (#877 가드)"
            exit 1
          fi
          # 상한 단언 (#946 리뷰 권고 ①) — libtest 이름 필터는 **부분 문자열 매칭**이라
          # `belong_to_*` 같은 이름이 의도치 않게 장기 경로로 딸려 들어올 수 있다.
          # 선택된 전건이 `::long_` 경계에서 시작하는지 확인해 과잉 매칭을 차단한다.
          # (하한만으로는 과잉을 못 잡는다 — 하한·상한 양방향 단언.)
          OVERMATCH=$(grep ': test$' /tmp/long-list.log | grep -vc '::long_' || true)
          if [ "${OVERMATCH}" -gt 0 ]; then
            echo "::error::long_ 부분 문자열 과잉 매칭 ${OVERMATCH}건 — 아래 목록 확인 (#877/#946 가드)"
            grep ': test$' /tmp/long-list.log | grep -v '::long_'
            exit 1
          fi

      # `--ignored` 는 ignore 마킹된 것만 실행 (`--include-ignored` 는 전체 실행).
      # 뒤따르는 `long_` 은 libtest 이름 필터 (부분 문자열 매칭) — #877 로 추가.
      # 이로써 diagnostic / scope-deferred `#[ignore]` 는 장기 경로에서 제외된다.
      - name: Rust 장기 적분 테스트 (physics-wasm, long_ ignored only)
        run: cargo test --release --manifest-path packages/physics-wasm/Cargo.toml -- --ignored long_ --nocapture
        # 장기 경로 실패는 머지 차단하지 않음 — CI 로그 관찰용.
        continue-on-error: true

  # P6-E #193 (E4) — 신규 함수 중복 방지 가드 (warn-only).
  # ADR: docs/decisions/20260417-duplicate-function-guard.md
  # pre-commit 우회 시 PR diff 로 재검사. exit 0 기본 (머지 차단 X).
  duplicate-function-guard:
    runs-on: ubuntu-latest
    # #915 — docs-only 스킵 (함수 diff 분석 대상은 코드뿐 — diff-scope 게이트).
    needs: diff-scope
    if: needs.diff-scope.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base 대비 diff 필요

      - uses: actions/setup-node@v4
        with:
          # #666 (Amendment 4) — 정확 버전 중앙 파일 일원화 (기존 node-version: 20).
          #   playwright 미사용 (deadlock 무관) 이나 SSoT 완성을 위해 동반 전환.
          node-version-file: '.node-version'

      - name: 가드 회귀 테스트 (픽스처 3종)
        run: node scripts/check-duplicate-functions.test.mjs

      - name: 중복 함수 가드 (PR diff)
        if: github.event_name == 'pull_request'
        run: node scripts/check-duplicate-functions.mjs --base origin/${{ github.base_ref }}
