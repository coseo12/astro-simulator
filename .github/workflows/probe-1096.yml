name: probe-1096

# ⚠️ 일회용 — #1096 재검증 전용. **머지 금지.**
# release-escape-watch.yml 의 **실 step 본문을 파일에서 추출해** Actions 런타임에서 실행한다.
#
# 지난 판 대비 고친 것 (PR #1140 reviewer 🟡-7) — 바인딩 충실도.
# 초판 bind() 는 `N` 을 뺀 모든 `${{ }}` 를 리터럴 `PROBE` 로 치환해 «값이 도착하는 경로» 축을
# 통째로 소거했고, 그래서 step 2 의 script injection 을 원리적으로 못 잡았다.
# 이번 판은 경로를 구분한다:
#   step 1 → `${{ }}` 텍스트 치환 (N 행 통째 교체)
#   step 2 · 3 → **env: 주입** (텍스트 치환 금지 — 실 workflow 와 같은 경로)
# 그리고 injection negative 를 신설해 **수정 전 판 FAIL / 수정 후 판 PASS** 를 같은 실행에서 가른다.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  checks: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실 workflow step 본문 추출 → Actions 런타임 실행 (양성/음성 + negative 4종)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # harness 는 «실패하도록 설계된» 명령의 exit code 를 읽으므로 -e 를 끈다.
          # 측정 대상인 추출된 step 본문은 그대로 `bash -e -o pipefail` 로 실행한다.
          set +e
          WF=.github/workflows/release-escape-watch.yml
          GH_REAL="$(command -v gh)"; export GH_REAL
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'STUB'
          #!/bin/bash
          if [ "${1:-}" = "issue" ] && [ "${2:-}" = "create" ]; then
            printf '%s\n' "$@" > "$RUNNER_TEMP/gh-issue-argv.txt"
            exit 0
          fi
          exec "$GH_REAL" "$@"
          STUB
          chmod +x "$RUNNER_TEMP/bin/gh"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          extract() {  # $1=시작 $2=끝 (고정문자열) $3=대상파일
            local s e f="${3:-$WF}"
            s=$(grep -nF -- "$1" "$f" | head -1 | cut -d: -f1)
            e=$(grep -nF -- "$2" "$f" | head -1 | cut -d: -f1)
            [ -n "$s" ] && [ -n "$e" ] || { echo "FAIL: 추출 실패 [$1]"; exit 1; }
            sed -n "${s},${e}p" "$f" | sed 's/^          //'
          }
          extract '          {' '          } | tee'                      > "$RUNNER_TEMP/step1.raw"
          extract '          VERDICT="$(cat' '>> "$GITHUB_STEP_SUMMARY"' > "$RUNNER_TEMP/step2.raw"
          extract '            echo "## 배경"' '          exit 1'        > "$RUNNER_TEMP/step3.body"
          { echo '{'; cat "$RUNNER_TEMP/step3.body"; } > "$RUNNER_TEMP/step3.raw"
          for f in step1 step2 step3; do
            n=$(wc -l < "$RUNNER_TEMP/$f.raw")
            echo "추출 $f = $n 행"
            [ "$n" -gt 3 ] || { echo "FAIL: $f 추출 이상"; exit 1; }
          done

          # step2 에 직접 보간이 남아 있으면 injection 회귀 — fail-fast
          if grep -qF -- 'github.event.pull_request' "$RUNNER_TEMP/step2.raw"; then
            echo "FAIL: step2 직접 보간 잔존 — injection 회귀"; exit 1
          fi
          echo "step2 직접 보간 잔존: 0 (env: 전환 확인)"

          FAILED=0
          run_case() {   # $1=N $2=기대
            local N="$1" expect="$2" rc1 rc2 rc3="-" verdict issue=no ok=OK
            export GITHUB_OUTPUT="$RUNNER_TEMP/out.txt"; : > "$GITHUB_OUTPUT"
            export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/sum.md"; : > "$GITHUB_STEP_SUMMARY"
            rm -f "$RUNNER_TEMP/gh-issue-argv.txt" "$RUNNER_TEMP/verdict.txt"

            sed "s@^N=.*@N=$N; REPO=coseo12/astro-simulator@" "$RUNNER_TEMP/step1.raw" > "$RUNNER_TEMP/s1.sh"
            bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/s1.sh" >/dev/null 2>&1; rc1=$?

            export PR_NUMBER="$N" BASE_REF=main HEAD_REF=develop
            bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/step2.raw" >/dev/null 2>&1; rc2=$?
            verdict=$(sed -n 's/^verdict=//p' "$GITHUB_OUTPUT")

            if [ "$verdict" = "ESCAPE" ]; then
              export REPO=coseo12/astro-simulator \
                     PR_URL="https://github.com/coseo12/astro-simulator/pull/$N" RUN_URL=probe
              bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/step3.raw" >/dev/null 2>&1; rc3=$?
            fi
            [ -f "$RUNNER_TEMP/gh-issue-argv.txt" ] && issue=yes

            [ "$verdict" = "$expect" ] || ok=MISMATCH
            { [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]; } || ok=STEP_FAIL
            if [ "$expect" = ESCAPE ]; then
              { [ "$rc3" = "1" ] && [ "$issue" = yes ]; } || ok=ESCAPE_BRANCH_FAIL
            else
              [ "$issue" = no ] || ok=UNEXPECTED_ISSUE
            fi
            printf '#%-6s 기대=%-6s 판정=%-7s s1=%s s2=%s s3=%-2s 이슈=%-3s → %s\n' \
              "$N" "$expect" "${verdict:-<빈값>}" "$rc1" "$rc2" "$rc3" "$issue" "$ok"
            [ "$ok" = OK ] || FAILED=1
          }

          echo "=== 3중 시뮬레이션: clean → ESCAPE → 복구 ==="
          run_case 1088 clean; run_case 636 ESCAPE; run_case 1068 clean
          echo "=== 양성 대조군 전건 ==="
          for n in 636 646 652 658; do run_case "$n" ESCAPE; done
          echo "=== 음성 대조군 전건 ==="
          for n in 1067 1068 1088; do run_case "$n" clean; done

          echo "=== negative 1: 미존재 PR → step1 exit != 0 ==="
          sed "s@^N=.*@N=999999; REPO=coseo12/astro-simulator@" "$RUNNER_TEMP/step1.raw" > "$RUNNER_TEMP/sn.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/sn.sh" >/dev/null 2>&1
          rc=$?; echo "  exit=$rc (기대 != 0)"; [ "$rc" -ne 0 ] || FAILED=1

          export GITHUB_OUTPUT="$RUNNER_TEMP/out.txt"; export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/sum.md"
          export PR_NUMBER=1088 BASE_REF=main HEAD_REF=develop
          echo "=== negative 2: 빈 판정 → step2 exit 1 ==="
          : > "$GITHUB_OUTPUT"; : > "$GITHUB_STEP_SUMMARY"; : > "$RUNNER_TEMP/verdict.txt"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/step2.raw" >/dev/null 2>&1
          rc=$?; echo "  exit=$rc (기대 1)"; [ "$rc" -eq 1 ] || FAILED=1

          echo "=== negative 3: 예상 외 문자열 → step2 exit 1 ==="
          : > "$GITHUB_OUTPUT"
          echo "FAIL: #1088 조회 실패 — 재실행" > "$RUNNER_TEMP/verdict.txt"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/step2.raw" >/dev/null 2>&1
          rc=$?; echo "  exit=$rc (기대 1)"; [ "$rc" -eq 1 ] || FAILED=1

          # ── negative 4 (신규): script injection 판별력 ──────────────────────────
          # 수정 전 판(커밋 010dd21) 과 수정 후 판(HEAD) 을 같은 실행에서 대조한다.
          # payload 는 무해 (파일 1개 생성) 하고 공백이 없어 git ref 로 적법하다.
          echo "=== negative 4 (신규): script injection — 수정 전 FAIL / 수정 후 PASS ==="
          git show 010dd21:.github/workflows/release-escape-watch.yml > "$RUNNER_TEMP/wf-before.yml"
          extract '          VERDICT="$(cat' '>> "$GITHUB_STEP_SUMMARY"' "$RUNNER_TEMP/wf-before.yml" > "$RUNNER_TEMP/step2-before.raw"
          PAYLOAD='release/x$(id>PWNED.txt)'
          printf '  payload=%s / git ref 적법성: ' "$PAYLOAD"
          git check-ref-format "refs/heads/$PAYLOAD" && echo "LEGAL" || echo "ILLEGAL"

          inj_variant() {  # $1=before|after
            local v="$1" rt="$RUNNER_TEMP/inj-$v" rc canary summary ok
            rm -rf "$rt"; mkdir -p "$rt"
            export GITHUB_OUTPUT="$rt/out.txt"; : > "$GITHUB_OUTPUT"
            export GITHUB_STEP_SUMMARY="$rt/sum.md"; : > "$GITHUB_STEP_SUMMARY"
            local saved="$RUNNER_TEMP"
            echo "clean" > "$rt/verdict.txt"
            if [ "$v" = before ]; then
              sed -e "s@[\$][{][{] github.event.pull_request.number [}][}]@1234@g" \
                  -e "s@[\$][{][{] github.event.pull_request.base.ref [}][}]@main@g" \
                  -e "s@[\$][{][{] github.event.pull_request.head.ref [}][}]@$PAYLOAD@g" \
                  "$RUNNER_TEMP/step2-before.raw" > "$rt/run.sh"
              unset PR_NUMBER BASE_REF HEAD_REF
            else
              cp "$RUNNER_TEMP/step2.raw" "$rt/run.sh"
              export PR_NUMBER=1234 BASE_REF=main HEAD_REF="$PAYLOAD"
            fi
            ( cd "$rt" && RUNNER_TEMP="$rt" bash --noprofile --norc -e -o pipefail run.sh >/dev/null 2>&1 ); rc=$?
            export RUNNER_TEMP="$saved"
            [ -f "$rt/PWNED.txt" ] && canary=YES || canary=no
            summary=$(grep -F -- '- PR:' "$rt/sum.md" 2>/dev/null) || summary='(없음)'
            if [ "$canary" = no ] && [ "$summary" = "- PR: #1234 (\`base=main\` / \`head=$PAYLOAD\`)" ]; then ok=PASS; else ok=FAIL; fi
            printf '  %-7s exit=%s 임의명령실행=%-3s %s\n           summary: %s\n' "$v" "$rc" "$canary" "$ok" "$summary"
            [ "$ok" = PASS ]
          }
          inj_variant before; b=$?
          inj_variant after;  a=$?
          if [ "$b" -ne 0 ] && [ "$a" -eq 0 ]; then
            echo "  판별력 실증 — 수정 전 FAIL / 수정 후 PASS"
          else
            echo "  판별력 0 — 두 판이 같은 결과 (테스트 무효)"; FAILED=1
          fi
          unset PR_NUMBER BASE_REF HEAD_REF

          echo
          [ "$FAILED" -eq 0 ] || { echo "FAIL: OK 아닌 셀이 있다"; exit 1; }
          echo "ALL PASS"
