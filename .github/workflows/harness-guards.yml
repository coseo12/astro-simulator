# HARNESS-DRIFT: Z-PATTERN [TODO]
name: Harness Guards

# 같은 sha 의 push+PR 중복 run 제거 (#779). group 에 github.workflow 포함 →
# 워크플로 간 교차 취소 방지. PR head sha == 머지 후 push sha 로 수렴 → 같은 sha 묶임.
# cancel 은 가드 약화 아님 — 동일 코드를 검증하는 중복 run 중 하나만 남김 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# harness 저장소 전용 가드 workflow (v3.0.0~).
# 이슈 #196 책임 분리에서 ci.yml 말미 블록을 이동해온 파일.
#
# 다운스트림 프로젝트 관점:
#   본 workflow 의 각 step 은 `hashFiles('scripts/verify-*.sh') != ''` 조건으로 보호되므로
#   해당 스크립트를 포함하지 않는 프로젝트에선 조용히 스킵된다. harness init 으로 새로
#   설치된 프로젝트는 scripts/ 경로를 frozen 으로 가져가므로 가드가 자동 동작.
#
# 책임 경계 (docs/decisions/20260421-workflows-responsibility-split.md):
#   - 본 파일 (`.github/workflows/harness-*.yml`) = frozen (upstream 소유)
#   - `.github/workflows/ci.yml` = user-only (다운스트림 소유)
#
# 근거: volt #62 — `ci.yml` 에 upstream 가드와 다운스트림 빌드/테스트 가 혼재되어
# `harness update` 가 6단계 push-fail-fix 루프를 유발한 관찰.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  harness-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # agent SSoT drift 가드 (#145)
      # CLAUDE.md `### sub-agent 검증 완료 ≠ GitHub 박제 완료` 의 공통 JSON 스키마 9개 필드가
      # 5개 에이전트 파일의 `## 마무리 체크리스트 JSON 반환` 섹션에 모두 존재하고 선언 순서를
      # 유지하는지 검사. drift 시 exit 1 로 PR 머지 전 차단.
      - name: agent SSoT drift 가드
        if: hashFiles('scripts/verify-agent-ssot.sh') != ''
        run: bash scripts/verify-agent-ssot.sh

      # create-pr SSoT drift 가드 (#480, #477 후속)
      # 5 페르소나 .md (architect/developer/pm/qa/reviewer) 에 박제된
      # "**PR 생성 시 반드시 `create-pr` 스킬 사용**" SSoT 문구의 존재 + 동일성 검증.
      # 한쪽만 갱신 시 drift 발생 → exit 1 로 차단.
      - name: create-pr SSoT drift 가드
        if: hashFiles('scripts/verify-create-pr-ssot.sh') != ''
        run: bash scripts/verify-create-pr-ssot.sh

      # release version bump 가드 (v2.28.1 복구와 함께 도입)
      # chore(release) PR 에서 CHANGELOG 를 업데이트했으나 package.json::version bump 를 누락하는 회귀를 차단.
      # 세션 3연속 릴리스 (v2.26.0~v2.28.0) 에서 실제 발생 → v2.28.1 로 복구 + 본 가드 도입.
      # CHANGELOG 최신 `## [X.Y.Z]` 엔트리와 package.json::version 일치 검증, 불일치 시 exit 1.
      - name: release version bump 가드
        if: hashFiles('scripts/verify-release-version-bump.sh') != ''
        run: bash scripts/verify-release-version-bump.sh

      # CLAUDE.md 각인 예산 가드 (#197 Phase 2)
      # 45k chars 초과 시 exit 1 로 감축 PR 을 강제. 35k/40k 는 warn (exit 0).
      # 지침: docs/guides/claudemd-governance.md §3 (정량 게이트)
      # 다운스트림 가드: lib/verify-claudemd-size.js 본체 부재 시 skip (upstream v3.6.0 lib 배포 누락 대응 — 본 PR #338 임시 패치)
      - name: CLAUDE.md 각인 예산 가드
        if: hashFiles('scripts/verify-claudemd-size.sh') != '' && hashFiles('lib/verify-claudemd-size.js') != ''
        run: bash scripts/verify-claudemd-size.sh

      # CLAUDE.md 상대 링크 무결성 가드 (#197 Phase 2)
      # CLAUDE.md → docs/ 포인터가 많아질수록 link rot 위험 증가 — 파일 존재 검증.
      # 지침: docs/guides/claudemd-governance.md §4.3
      # 다운스트림 가드: lib/verify-docs-links.js 본체 부재 시 skip (upstream v3.6.0 lib 배포 누락 대응 — 본 PR #338 임시 패치)
      - name: CLAUDE.md 상대 링크 무결성 가드
        if: hashFiles('scripts/verify-docs-links.sh') != '' && hashFiles('lib/verify-docs-links.js') != ''
        run: bash scripts/verify-docs-links.sh

      # docs/lessons/ README 동기화 가드 (#213)
      # Phase 3-A 에서 신설된 docs/lessons/ 디렉토리의 목차 README 누락 방지.
      # 신규 레슨 파일이 README "파일 목록" 표에 등록되지 않으면 exit 1 로 PR 머지 차단.
      - name: docs/lessons README 동기화 가드
        if: hashFiles('scripts/verify-lessons-readme.sh') != ''
        run: bash scripts/verify-lessons-readme.sh

      # HARNESS-DRIFT 데코레이터 가드 (#556 ADR 20260515 Amendment 8)
      # Phase 1 임시 수정 파일 (manifest sha256 불일치) 에 HARNESS-DRIFT 데코레이터
      # 박제 의무 — 누락 시 exit 1 (fail-fast). 정적 분석 도구 / 보안 검수자가
      # "승인받은 임시 drift" 즉시 식별 가능 (trustless 영속화, cross-validate agy 권고).
      # SSoT: docs/decisions/20260515-harness-managed-divergent-pattern.md §Amendment 8
      - name: HARNESS-DRIFT 데코레이터 가드
        if: hashFiles('scripts/verify-harness-drift-decorator.mjs') != ''
        run: node scripts/verify-harness-drift-decorator.mjs
