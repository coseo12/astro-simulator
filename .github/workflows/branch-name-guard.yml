name: Branch Name Guard

# PR head 브랜치명이 `<type>/<이슈번호>-<설명>` 규약을 지키는지 검사한다 (#962 축 B).
#
# 배경: #942 가 브랜치 접두사 규약을 일반화했으나 **강제 수단이 0** 이었다. PR #961 의
# cross-validate (agy) 권고 — "문서 규약은 컨텍스트가 길어지면 잊히는 실패 모드가 있으니
# 강제력을 CI 로 위임하라" — 의 집행.
#
# 규약 정본(SSoT) 은 `scripts/verify-branch-name.mjs` 의 상수다. 본 workflow 는 정규식을
# 인라인으로 복제하지 않는다 (4번째 축자 사본 = drift 재생산). 산문 3곳의 drift 는
# `project-guards.yml` 의 `--verify-ssot` 스텝이 별도로 검사한다.
# 계약 SSoT: docs/decisions/20260806-962-branch-name-guard.md §5
#
# ── 트리거 설계 (ADR §5-2) ──────────────────────────────────────────────────────
# `pull_request` **전용**. push ref 검사 미채택 — PR 없이 develop 에 도달하는 경로가
#   없으므로 추가 차단력이 0 이고, 두 이벤트를 함께 처리하면 `if: github.event_name == ...`
#   분기가 필요한데 이는 CLAUDE.md §가드 설계 원칙이 금지하는 fallback 분기와 구조가 같다
#   (한쪽 이벤트에서 조용히 스킵). `pull_request` 전용이면 `head_ref` 가 항상 존재해 분기 0.
# types `[opened, synchronize]` — `reopened` **의도적 제외**. head_ref 는 PR 생성 후 변경
#   불가라 `opened` 로 충분하고, 제외가 유일한 잔여 노출(과거 PR reopen)을 닫는다.
# `branches:` 필터 **미사용** (= 모든 base). 저장소의 다른 workflow 는 전부
#   `branches: [develop, main]` 이지만 본 가드는 의도적으로 이탈한다 — 봇 PR 17건이
#   `base=feature/*` 로 열린 실측이 있어, base 필터를 걸면 정확히 봇 브랜치가 사각지대가
#   된다. 규약의 대상은 head 이지 base 가 아니다.
#
# ── CRITICAL: `pull_request_target` 금지 (ADR §5-3) ─────────────────────────────
# 트리거는 반드시 `pull_request` 다. `pull_request_target` 은 base 리포 컨텍스트에서
# 쓰기 가능 토큰과 함께 실행되므로, fork 가 제어하는 브랜치명을 다루는 본 가드에서는
# 권한 상승 경로가 된다. 본 가드는 secret 도 write 권한도 필요 없다.
#
# ── CRITICAL: script injection 회피 (ADR §5-3) ─────────────────────────────────
# `${{ github.event.pull_request.head.ref }}` 를 `run:` 본문에 직접 보간하면 브랜치명이
# 셸로 해석된다 (명령 치환·변수 확장). 반드시 `env:` 로 받아 `"$HEAD_REF"` 로 인용 전달한다.
#
# ── hashFiles silent-skip 정책 (#945/#950) ─────────────────────────────────────
# SSoT 는 ci.yml §hashFiles silent-skip 정책 블록. 전 스텝 `if: hashFiles(...)` **미사용**.
# `scripts/verify-branch-name.mjs` 부재는 배포 시나리오가 아니라 **가드가 삭제된 회귀**이므로
# node ENOENT 로 즉시 FAIL 하는 것이 유일한 정상 동작이다. `--if-present` 도 미사용.
#
# ── 강제력 (구 "한계" 절 회수 — #970, 2026-08-12) ───────────────────────────────
# 종전 이 자리에는 *"`main` 에 required_status_checks 부재 → 붉은 X 는 뜨지만 머지를
# 막지 못한다"* (2026-08-06 실측) 가 적혀 있었다. **더 이상 참이 아니다** — 후속 이슈였던
# #971 의 Phase 1 이 2026-08-08 에 적용됐다.
#   실측 2026-08-12 `GET /repos/coseo12/astro-simulator/branches/main/protection`
#     → required contexts: ["project-guards", "branch-name", "label-pr"] / enforce_admins: true
#     → develop 은 여전히 404 (ADR 20260807-971 결정 2 로 **영구 미채택**)
# 따라서 이 job (`branch-name`) 은 `main` 대상 PR 에서 **머지를 기계적으로 막는다**.
# ⚠️ 이 job 에 스텝을 추가하는 것은 required check 의 판정 표면을 넓히는 행위다.
#    오차단 시 릴리스가 하드 블록되고 enforce_admins 때문에 admin 우회로도 없다.
#    탈출구는 docs/guides/branch-strategy-workflow.md §required status check 롤백 R1 한 줄.
#
# ── #970 축 F1 — PR base 선택 규칙 (두 번째 스텝) ──────────────────────────────
# CLAUDE.md §금지 사항의 나머지 절반 (`base=main` 은 release PR(head=develop)/hotfix 전용).
# 정본은 `scripts/verify-pr-base-rule.mjs` 의 `BASE_RULES` 매트릭스이며, 브랜치 종류 판정에
# 필요한 리터럴은 전부 `verify-branch-name.mjs` 에서 **import** 한다 (축자 사본 0).
# 계약 SSoT: docs/decisions/20260812-970-pr-base-rule-guard.md §5
#
# 스텝 순서 (base 를 **뒤에**) 는 의도적이다. base 가드의 `unresolved` 판정은 head 이름
# 규약 위반에서 파생되므로 브랜치명이 먼저 판정돼야 진단이 정확하다.
#
# ── `if: ${{ !cancelled() }}` — 진단 가림 완화 (#1023 reviewer 🟡5) ──────────────
# 종전 이 자리에는 *"앞 스텝이 실패하면 뒤 스텝이 실행되지 않아 `unresolved` 는 CI 에서
# 구조적으로 도달 불가"* 라고 적혀 있었다. 서술 자체는 맞았으나 **가려지는 것이
# `unresolved` 만이 아니었다** — §5 귀속 규칙상 `base=main` + head shape 불명은 `violation`
# **확정**인데(비대칭의 핵심), 정확히 그 조합이 앞 스텝에서 먼저 죽어 base 진단이 안 보였다.
# head 이름과 base 가 둘 다 틀린 PR 은 브랜치·PR 재생성(~3분) 후에야 base 진단을 처음 보는
# **왕복 2회**가 된다.
#
# 완화는 조건 1줄이다. **required check 의 결론은 불변**임을 근거와 함께 명시한다:
#   - 이 조건은 스텝 실행을 **추가**만 한다. 앞 스텝이 성공했으면 원래도 실행됐고, 앞 스텝이
#     실패했으면 job 은 이미 실패다. 즉 **성공이 실패로 뒤집히는 경로가 없고, 실패가 성공으로
#     뒤집히는 경로도 없다** (이미 실패한 job 에 진단 한 줄이 더 나올 뿐).
#   - `always()` 가 아니라 `!cancelled()` 인 이유: 위 `concurrency.cancel-in-progress` 로
#     superseded run 이 일상적으로 취소되는데, `always()` 는 **취소 중에도** 스텝을 돌려
#     코스메틱 CANCELLED run 에 무의미한 어노테이션을 남긴다
#     (docs/ops/operational-friction.md §4). `!cancelled()` 는 "앞 스텝 실패와 무관하게 돌되
#     취소 시에는 돌지 않는다" 는 의도를 정확히 표현한다.
#
# ⚠️ **부수 효과 — `unresolved` 가 CI 에서 도달 가능해진다.** `base=develop` + 이름 규약 위반
# head 가 이제 두 스텝을 모두 타고, 뒤 스텝은 `unresolved`(exit 1, 귀속: branch-name) 를 낸다.
# 이는 의도된 것이다 — 그 셀의 교정 지시가 *"base 는 정상이니 head 이름만 고쳐라"* 라서
# 진단 가치가 있고, 앞 스텝이 이미 실패했으므로 새로 막히는 PR 은 **0** 이다.
# (스크립트는 계속 fail-closed 로 구현한다 — 도달 가능성 여부를 근거로 통과시키지 않는다.)
#
# 별도 job 으로 분리하지 않은 이유: 새 job 은 새 체크 이름이 되고, 그것을 required 로
# 등록하려면 저장소 보호 설정 변경(`PUT`)이 필요하다. 같은 job 의 스텝으로 두면 기존
# `branch-name` 컨텍스트를 그대로 쓰므로 **설정 변경 0 으로 강제력을 얻는다**.

# 중복 run 제거 (#779) — 단, group 키는 **sha 가 아니라 PR 번호**다.
#
# 저장소의 다른 워크플로는 `head.sha` 로 묶는다. 그것은 검사 대상이 **내용**인 가드에는
# 옳지만 본 가드에는 틀리다 — 본 가드의 검사 대상은 내용이 아니라 **ref(브랜치명)** 이다.
# 서로 다른 두 브랜치가 같은 커밋을 가리키는 일은 정상적으로 발생하며(예: develop 과
# 같은 sha 에서 잘라낸 release/*-prep, 재생성된 브랜치), sha 로 묶으면 한쪽 PR 의
# 브랜치명 판정이 `cancel-in-progress` 로 **취소되어 아무 판정도 남지 않는다**.
# CANCELLED 는 실패가 아니라 관례상 코스메틱으로 취급되므로(docs/ops/operational-friction.md §4)
# 아무도 눈치채지 못한다 — 본 설계가 금지하는 silent skip 이다.
# 2026-08-06 일회용 PR 실증에서 실제로 재현됐다 (#967 CANCELLED / #968 만 판정).
#
# PR 번호로 묶으면 같은 PR 안의 연속 push 만 supersede 되고(의도한 dedup), 서로 다른 PR 은
# 절대 교차 취소되지 않는다. `pull_request` 전용 트리거라 번호는 항상 존재한다 (fallback 불요).
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read # 어노테이션(::error::)만 사용 — write 불요

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #666 전수 명시 핀 정책 — 러너 기본 Node 버전에 암묵 의존하지 않는다.
      # `.node-version` SSoT. 가드가 node 표준 라이브러리만 쓰므로 pnpm install 은 불필요.
      - name: Node.js setup (.node-version 핀)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: 브랜치명 규약 가드 (#962)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/verify-branch-name.mjs --branch "$HEAD_REF"

      # base·head 를 `env:` 로 받아 `"$VAR"` 로 인용 전달한다 (앞 스텝과 동일 이유 —
      # `${{ }}` 를 `run:` 본문에 직접 보간하면 브랜치명이 셸로 해석된다).
      # 라벨 형식(`base=` / `head=`)은 스크립트가 강제한다 — 위치 인자였다면 순서를
      # 뒤바꿔도 `develop→main` 과 `main→develop` 이 둘 다 허용 셀이라 조용한 오답이 된다.
      - name: PR base 선택 규칙 가드 (#970)
        # 앞 스텝(브랜치명) 실패가 base 진단을 가리지 않게 한다 — 헤더 §진단 가림 완화 참조.
        # 취소 시에는 돌지 않는다 (`always()` 미채택 근거도 헤더).
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/verify-pr-base-rule.mjs --pr base="$BASE_REF" head="$HEAD_REF"
