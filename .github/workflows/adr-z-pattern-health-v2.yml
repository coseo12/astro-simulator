name: ADR 20260515 Z Pattern Health Metric

# ADR 20260515 Z 패턴 §재검토 조건 #5 자동 발화 가드.
#
# 매주 월요일 09:00 KST (UTC 00:00) 에 verify-z-pattern-health.mjs 를 실행.
# 3중 OR 임계값 (Amendment 1+2 정합) 발화 시 [ADR Trigger] 이슈 자동 생성.
#
# workflow_dispatch 2단계 함정 (volt #69):
#   - workflow_dispatch 는 default branch (develop) 반영 후에만 discover 됨
#   - 본 PR 머지 후 D2/D3 검증은 develop 반영 후 1회 수동 실행으로 수행

# YAML 1.1 'on:' → boolean True 함정 — quote 로 string key 강제 (volt 캡처 후보)
"on":
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 UTC 00:00 = KST 09:00
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Z Pattern Health
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/verify-z-pattern-health.mjs | tee /tmp/health-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # workflow 자체는 항상 PASS (이슈 생성으로 알림)
          exit 0

      - name: Create [ADR Trigger] issue
        if: steps.verify.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 중복 방지 — 동일 제목 OPEN 이슈 검색
          EXISTING=$(gh issue list \
            --search '"[ADR Trigger] Z 패턴 §재검토 조건 #5 발화" in:title' \
            --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "이미 [ADR Trigger] OPEN 이슈 존재 — 중복 생성 스킵"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          HEALTH_OUTPUT=$(node scripts/verify-z-pattern-health.mjs 2>&1 || true)

          gh issue create \
            --title "[ADR Trigger] Z 패턴 §재검토 조건 #5 발화 (자동 탐지 ${DATE})" \
            --label "documentation,priority:high" \
            --body "## 배경
          자동 탐지 workflow \`.github/workflows/adr-z-pattern-health.yml\` 발화. 임계값 충족.

          ## 임계값 발화 결과
          \`\`\`
          ${HEALTH_OUTPUT}
          \`\`\`

          ## 의무 (Amendment 1 §재검토 조건 #5 정합)
          3 영업일 내 결정 분기 (A Phase 2 일괄 / B 폐기 / C 임계값 재조정).

          ## Cross-link
          - ADR: \`docs/decisions/20260515-harness-managed-divergent-pattern.md\`
          - workflow: \`.github/workflows/adr-z-pattern-health.yml\`
          - 직전 [ADR Trigger]: #487 (옵션 C 채택)"

      - name: Fail on script execution error
        if: steps.verify.outputs.exit_code == '2'
        run: |
          echo "ERROR: verify-z-pattern-health.mjs 실행 실패 (exit code 2)"
          exit 1

      # Amendment 8 (#556) — Phase 2 중도 변경 정적 비교 soft-warn 처리.
      # verify-z-pattern-health.mjs 의 stdout 에서 [Phase 2 Sync Drift] 라인 감지 시
      # [Phase 2 Sync Required] 라벨 부착 + 자동 코멘트 박제 (CI fail 아님).
      - name: Detect Phase 2 sync drift (soft-warn)
        id: phase2-sync
        run: |
          if grep -q "\[Phase 2 Sync Drift\]" /tmp/health-output.txt 2>/dev/null; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "=== Phase 2 sync drift block ==="
            grep -A 20 "\[Phase 2 Sync Drift\]" /tmp/health-output.txt || true
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply [Phase 2 Sync Required] label + comment
        if: steps.phase2-sync.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 중복 방지 — 이미 [Phase 2 Sync Required] OPEN 이슈 존재 시 스킵
          EXISTING=$(gh issue list \
            --search '"[Phase 2 Sync Required]" in:title' \
            --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "이미 [Phase 2 Sync Required] OPEN 이슈 존재 — 중복 생성 스킵"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          DRIFT_BLOCK=$(grep -A 50 "\[Phase 2 Sync Drift\]" /tmp/health-output.txt | head -60 || true)

          gh issue create \
            --title "[Phase 2 Sync Required] ADR 20260515 Amendment 8 (자동 탐지 ${DATE})" \
            --label "documentation,priority:medium" \
            --body "## 배경
          자동 탐지 workflow \`.github/workflows/adr-z-pattern-health-v2.yml\` 의
          Amendment 8 Phase 2 중도 변경 정적 비교 가드 발화. upstream open PR 의
          변경 파일이 로컬 drift 파일과 매칭 — Amendment 5 (upstream 리뷰 즉시 동기화 의무) 적용 필요.

          ## drift 매칭 결과
          \`\`\`
          ${DRIFT_BLOCK}
          \`\`\`

          ## 의무 (ADR §운영 절차 Phase 2 단계 3 + Amendment 8 단계 4)
          upstream PR 의 리뷰 피드백을 본 프로젝트 동일 파일에 즉시 동기화. 후속 커밋 또는 PR.

          ## Cross-link
          - ADR: \`docs/decisions/20260515-harness-managed-divergent-pattern.md\`
          - workflow: \`.github/workflows/adr-z-pattern-health-v2.yml\`
          - 가드 스크립트: \`scripts/verify-z-pattern-health.mjs\` (\`verifyPhase2Sync()\`)"

      # Amendment 9 (#557) — 경고 피로감 가드 (활성 drift ≥ N=10 soft-warn).
      # ADR §Amendment 9 §결정점 3 — verify-harness-drift-decorator.mjs `--mode=count-warn`
      # CLI 플래그 분기로 통합. soft-warn (exit 0 + stdout 마커) → CI workflow grep 으로
      # 감지하여 [Alert Fatigue Trigger] 자동 이슈 생성 (CI hard-block 아님).
      - name: Verify Alert Fatigue Threshold (soft-warn)
        id: alert-fatigue
        run: |
          set +e
          node scripts/verify-harness-drift-decorator.mjs --mode=count-warn | tee /tmp/alert-fatigue-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # stdout 에서 [Alert Fatigue Trigger] 마커 감지
          if grep -q "\[Alert Fatigue Trigger\]" /tmp/alert-fatigue-output.txt 2>/dev/null; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "=== Alert Fatigue Trigger block ==="
            cat /tmp/alert-fatigue-output.txt
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi
          # soft-warn — workflow 자체는 항상 PASS (이슈 생성으로 알림)
          exit 0

      # Amendment 10 (#569) — [TODO] → upstream PR URL 자동 해소 (soft-warn).
      # resolve-harness-drift-todo.mjs --dry-run 으로 매칭 검색 후 stdout 마커 감지 시
      # [TODO Resolution Suggested] 자동 코멘트 박제 (CI fail 아님, ADR §Amendment 10 §결정점 3 정합).
      - name: Detect [TODO] resolution candidates (soft-warn)
        id: todo-resolve
        run: |
          set +e
          node scripts/resolve-harness-drift-todo.mjs --dry-run | tee /tmp/todo-resolve-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # stdout 에서 [TODO Resolution Suggested] 마커 감지
          if grep -q "\[TODO Resolution Suggested\]" /tmp/todo-resolve-output.txt 2>/dev/null; then
            echo "triggered=true" >> $GITHUB_OUTPUT
            echo "=== TODO Resolution block ==="
            cat /tmp/todo-resolve-output.txt
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi
          # soft-warn — workflow 자체는 항상 PASS (이슈 생성으로 알림)
          exit 0

      - name: Create [TODO Resolution Suggested] issue
        if: steps.todo-resolve.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 중복 방지 — 동일 제목 OPEN 이슈 검색
          EXISTING=$(gh issue list \
            --search '"[TODO Resolution Suggested] ADR 20260515 Amendment 10" in:title' \
            --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "이미 [TODO Resolution Suggested] OPEN 이슈 존재 — 중복 생성 스킵"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          TODO_BLOCK=$(cat /tmp/todo-resolve-output.txt)

          gh issue create \
            --title "[TODO Resolution Suggested] ADR 20260515 Amendment 10 (자동 탐지 ${DATE})" \
            --label "documentation,priority:medium" \
            --body "## 배경
          자동 탐지 workflow \`.github/workflows/adr-z-pattern-health-v2.yml\` 의
          Amendment 10 (#569) [TODO] → upstream PR URL 자동 해소 가드 발화. upstream merged PR 의
          (title 이슈 ref AND 파일 경로) 매칭 후보 발견 — Phase 2 머지 직후 사후 해소 의무.

          ## 매칭 결과
          \`\`\`
          ${TODO_BLOCK}
          \`\`\`

          ## 의무 (ADR §Amendment 10 §결정점 3 — soft-warn)
          매칭 결과 검토 후:
          - **자동 갱신**: \`node scripts/resolve-harness-drift-todo.mjs --apply\` (file write 수행)
          - **수동 fallback**: 매칭 결과 잘못된 경우 \`--file=<path>\` 로 단일 파일 갱신 또는 수동 편집

          ## Cross-link
          - ADR: \`docs/decisions/20260515-harness-managed-divergent-pattern.md\` §Amendment 10
          - workflow: \`.github/workflows/adr-z-pattern-health-v2.yml\`
          - 가드 스크립트: \`scripts/resolve-harness-drift-todo.mjs\` + \`scripts/verify-z-pattern-health.mjs\` (\`computeTodoResolutions()\`)
          - 직전 Amendment: #557 (Amendment 9, [Alert Fatigue Trigger])"

      - name: Create [Alert Fatigue Trigger] issue
        if: steps.alert-fatigue.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 중복 방지 — 동일 제목 OPEN 이슈 검색
          EXISTING=$(gh issue list \
            --search '"[Alert Fatigue Trigger] ADR 20260515 Amendment 9" in:title' \
            --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "이미 [Alert Fatigue Trigger] OPEN 이슈 존재 — 중복 생성 스킵"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          ALERT_BLOCK=$(cat /tmp/alert-fatigue-output.txt)

          gh issue create \
            --title "[Alert Fatigue Trigger] ADR 20260515 Amendment 9 발화 (자동 탐지 ${DATE})" \
            --label "documentation,priority:high" \
            --body "## 배경
          자동 탐지 workflow \`.github/workflows/adr-z-pattern-health-v2.yml\` 의
          Amendment 9 (#557) 경고 피로감 가드 발화. 활성 drift 파일 수가 임계 N=10 도달/초과 —
          alert fatigue (개발자가 다른 치명적 drift/오염도 무시하게 되는 심리적 부작용) 위험 영역 진입.

          ## 임계 발화 결과
          \`\`\`
          ${ALERT_BLOCK}
          \`\`\`

          ## 의무 (ADR §Amendment 9 §결정점 2 옵션 A)
          3 영업일 내 결정 분기:
          - **옵션 1 — Phase 2 가속**: 점진 drift 해소 (upstream 기여 진행으로 자연 정리)
          - **옵션 2 — 일부 Phase 1 revert**: 긴급 정리 (가장 오래된 drift 부터 제거)
          - **옵션 3 — N 임계값 재조정**: Amendment 2/7 silent 약화 사이클 답습 (신중)

          ## §재검토 조건 #5 동시 발화 시 우선순위
          §재검토 조건 #5 (Phase 2 진행률 시간/누적 차원) 와 본 #6 (drift 파일 수 차원) 동시 발화 시
          **#5 우선** — Phase 2 강제 우위 (ADR §Amendment 9 §silent 가드 강화 vs 약화 자기점검).

          ## Cross-link
          - ADR: \`docs/decisions/20260515-harness-managed-divergent-pattern.md\` §Amendment 9
          - workflow: \`.github/workflows/adr-z-pattern-health-v2.yml\`
          - 가드 스크립트: \`scripts/verify-harness-drift-decorator.mjs\` (\`--mode=count-warn\`)
          - 직전 [ADR Trigger]: #495/#500/#554 (§재검토 조건 #5 패턴)"
