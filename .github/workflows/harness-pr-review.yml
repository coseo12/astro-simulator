name: Harness PR 자동 리뷰 트리거

# #1184 — push 시 `stage:*` 단일화. 결정 로직 SSoT 는 `scripts/stage-label-decision.mjs` 이고
# 본 workflow 는 어댑터만 담당한다 (결정 로직 0줄).
#
# ## 순서 불변식 — 「스킵 판정 → 제거 → 부착」 (D6-B)
#
# 제거를 스킵 판정보다 **앞에** 두면 안 된다. 스킵 판정이 읽는 PR 라벨은
# `context.payload.pull_request.labels`, 즉 **이벤트 시점 스냅샷**이라 선행 제거가 그 값을
# 바꾸지 못한다. 그래서 스킵이 여전히 걸리고(`stage:qa` 를 보고 중단), 그 시점엔 이미 제거가
# 끝나 있어 **`stage:*` 가 하나도 남지 않는다.** #915 가 이 스킵을 넣은 이유(리뷰 후 단계를
# push 로 되돌리지 않는다)를 되돌리면 안 된다.
#
# 모듈은 그 불변식을 규율이 아니라 **구조로** 보장한다: `runLabelSync` 가 `decide()` 로 결정을
# 값으로 확정한 뒤에만 변이 API 를 호출하고, 스킵은 실행기의 `if` 가 아니라 **빈 배열**로
# 표현된다. 변이 테스트 M2(제거 루프를 `decide()` 앞으로 이동)가 이 불변식만을 검사한다.
#
# ## checkout 을 추가한 이유와 그 조건
#
# 결정 로직을 파일로 분리(D9)했으므로 러너에 저장소가 있어야 한다. `pull_request` 의 기본 ref
# (PR 병합 ref) 를 받는다 — base ref 를 받으면 본 workflow 를 수정하는 PR 이 자기 수정본을
# 실행하지 못해 `workflow_dispatch` 2단계 함정과 동형이 되고 실행 증거가 머지 후로 밀린다.
# ⚠️ **재검토 조건**: 현재 fork PR 이력이 0건이라 PR 쪽 코드를 받는 노출면이 없다는 판단이다.
# fork PR 을 받기 시작하면 이 판단을 재검토한다 (#1184 설계 R4).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop, main]

# GITHUB_TOKEN 최소 권한 — PR/이슈 라벨 조작 (contents:read 는 checkout 용).
# ⚠️ `contents: read` 누락 시 checkout 이 403 으로 죽고 라벨링 전체가 멈춘다.
permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  label-pr:
    runs-on: ubuntu-latest
    # Draft PR은 라벨 부착 스킵
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      # 사용 직전 결정 로직 자기 검증 — 회귀 시 오작동 라벨링 대신 fail-fast.
      # (`auto-close-issues.yml` self-test 스텝 형태 계승. ci.yml detect-and-test 에도
      #  상시 배선 — #897 교훈: CI 미배선 self-test 는 0회 실행)
      - name: 라벨 결정 로직 self-test
        run: node scripts/stage-label-decision.test.mjs

      - name: 'PR/이슈 stage:* 라벨 동기화 (단일화)'
        uses: actions/github-script@v7
        with:
          script: |
            // 모듈 로드는 **절대 file URL** 고정이다. `import()` 의 상대 지정자는 cwd 도
            // GITHUB_WORKSPACE 도 아닌 **AsyncFunction 을 생성한 모듈의 디렉토리**
            // (= actions/github-script 의 dist) 기준으로 해석돼 ERR_MODULE_NOT_FOUND 가 된다.
            // `require()` 는 대상이 ESM 이라 ERR_REQUIRE_ESM 로 배제됐다 (#1184 설계 §0 E1~E3).
            const { runLabelSync } = await import(
              require('node:url').pathToFileURL(
                `${process.env.GITHUB_WORKSPACE}/scripts/stage-label-decision.mjs`
              ).href
            );

            await runLabelSync({
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: context.payload.pull_request.number,
              prLabels: (context.payload.pull_request.labels ?? []).map((l) => l.name),
              prBody: context.payload.pull_request.body || '',
              api: github.rest.issues,
              log: console.log,
            });
