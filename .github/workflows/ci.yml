      #          (S4) 버튼 재호출 + backdrop 닫기  (S5) 모바일 375px 3섹션 + 가로 overflow 0
      #          (S6) about/sensitivity Esc 비충돌 (모달 컨벤션 SSoT)
      - name: '#737 온보딩 회귀 가드 (verify:737-onboarding)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-737-onboarding.mjs') != ''
        run: BASE_URL=http://localhost:3002 node apps/web/scripts/browser-verify-737-onboarding.mjs

      # P7-D 모바일 — 전 4축 중 **3/4 만 배선** (#932 축 분할):
      #   (3) navigator.gpu 차단 → tier-c-graceful-degradation 노티   ← 배선
      #   (4) key-scoped dismiss 격리 (A 닫아도 B 표시)               ← 배선
      #   (1) `?bh=2` JD 진행 + 콘솔 에러 0                            ← 로컬 전용
      #   (2) `?bh=2&integrator=yoshida4` 조합 5초 재생 무에러         ← 로컬 전용
      #
      # 배선 축(3/4)은 `navigator.gpu` 를 addInitScript 로 **명시 차단**하므로 호스트 adapter 유무와
      #   무관하다 — detectGpuTier() 분기 1/2 양쪽이 tier-c 를 반환하고 adapter 분류(분기 3)에
      #   도달하지 않는다 (순수 함수 증명). 그래서 ubuntu 에서도 결정적이다.
      # 로컬 전용 축(1/2)은 launch 인자 `--enable-unsafe-webgpu` 때문에 `navigator.gpu` 는 존재하나
      #   ubuntu 러너는 `requestAdapter()` 가 null → Babylon WebGPUEngine 생성 fatal → 시나리오 1 의
      #   `콘솔 에러 0건`/`pageerror 0건` 위반 + 시나리오 2 탭 크래시 (run 30751043285 실측).
      #   `--enable-unsafe-webgpu` 를 빼면 통과하지만 macOS 에서 재던 "WebGPU 엔진 초기화 무결" 축이
      #   소멸한다 — 그 축은 ubuntu 에서 애초에 측정 불가라, 측정 가능한 로컬에 남긴다.
      #   선례 정합: 이 플래그를 쓰는 스크립트는 전부 CI 미배선이고, ubuntu green 인 브라우저
      #   회귀 가드는 하나도 이 플래그를 쓰지 않는다.
      # `BROWSER_VERIFY_GPU=swiftshader` — 스크립트 로컬 기본값 metal 은 macOS 전용이라 ubuntu
      #   러너에서 쓸 수 없다. 렌더러 축은 `GPU_LAUNCH_ARGS` SSoT 로 주입한다 (#932).
      - name: '#209 P7-D 모바일 구조 게이트 (verify:mobile-p7d — 시나리오 3/4)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/browser-verify-mobile-p7d.mjs') != ''
        env:
          BROWSER_VERIFY_GPU: swiftshader
          BASE_URL: http://localhost:3002
        run: node scripts/browser-verify-mobile-p7d.mjs --scenarios=3,4

      # ============================================================
      # #846 — 백그라운드 서버 정리 (dev :3002 + r1 next start :3001)
      # ============================================================
      # `if: always()` 가 정리의 단독 책임 지점이다. 개별 가드 step 안의 `kill` 은 Actions 기본
      #   셸(`bash -e {0}`) 특성상 **가드 성공 시에만** 도달하는 죽은 코드였고, 정작 정리가
      #   필요한 실패 경로에서 실행되지 않았다 (로컬 `bash -e` 재현 실측).
      # 정리 스크립트는 항상 exit 0 — 여기서 non-zero 를 내면 원래 실패 원인을 덮어쓴다.
      - name: '#846 백그라운드 서버 정리'
        # #915 — docs-only (code_changed != true) 에선 서버가 뜬 적이 없으므로 정리도 스킵
        if: always() && needs.diff-scope.outputs.code_changed == 'true' && hashFiles('scripts/ci-dev-server.sh') != ''
        run: |
          bash scripts/ci-dev-server.sh stop 3002 /tmp/ci-dev.pid
          kill "$(cat /tmp/r1-web.pid 2>/dev/null)" 2>/dev/null || true

      # ============================================================
      # NOTE: 프로젝트 소유 가드 (agent SSoT / docs 링크 본검사 / CLAUDE.md 예산 등) 는
      # `.github/workflows/project-guards.yml` 담당 (#907 — 구 harness-guards.yml 재편).
      # ============================================================
