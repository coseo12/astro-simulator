name: CI

# 같은 sha 의 push+PR 중복 run 제거 (#779). group 에 github.workflow 포함 →
# 워크플로 간 교차 취소 방지. PR head sha == 머지 후 push sha 로 수렴 → 같은 sha 묶임.
# cancel 은 가드 약화 아님 — 동일 코드를 검증하는 중복 run 중 하나만 남김 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  # ============================================================
  # #915 범위 1 — diff-scope 판별 선행 job (docs-only 시 무거운 경로 스킵)
  # ============================================================
  # 분류 SSoT: scripts/ci-diff-scope.mjs (self-test 사용 직전 실행).
  #   docs = docs/** ∪ *.md (전 경로) ∪ .claude/** / 그 외 전부 코드 (fail-safe: 미지 = 코드).
  #   경계: scripts/** · .github/** 은 검증 인프라 자체 변경이므로 코드 취급 (#915 경계 계약).
  # 판별 단위 주의: pull_request 는 **PR 전체 diff** 기준 — 코드 PR 에 docs 커밋이 뒤따라도
  #   전 세트가 계속 돈다. per-commit 판별은 코드 최종 상태를 미검증 상태로 머지시킬 수 있어
  #   (= 가드 약화) 의도적으로 채택하지 않았다. docs-only 스킵은 PR diff 전체가 docs 일 때만.
  # required check 상호작용: main branch protection 의 required_status_checks = null 실측
  #   (2026-08-01, #915) — 스킵된 job 이 머지를 막지 않으므로 skip-success 보고 패턴 불요,
  #   단순 if: 게이트로 충분. required check 도입 시 본 전제 재검토.
  # paths-ignore (workflow 단위) 가 아닌 job 단위 게이트인 이유: detect-and-test 의 SSoT
  #   가드 (zombie/dead-wait 등) 는 docs 변경도 검증해야 하므로 workflow 전체 스킵 불가.
  diff-scope:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      app_code_changed: ${{ steps.scope.outputs.app_code_changed }}
      changelog_touched: ${{ steps.scope.outputs.changelog_touched }}
    steps:
      - uses: actions/checkout@v4

      - name: 분류기 self-test (사용 직전 자기 검증)
        run: node scripts/ci-diff-scope.mjs --self-test

      - name: 변경 파일 판별 + 분류
        id: scope
        run: |
          # depth-1 checkout + 대상 sha 표적 fetch — 외부 액션/전체 clone 없이 diff 산출.
          # fetch 실패 (force-push 로 before 소실 등) 시 빈 목록 → 분류기가 fail-safe 로
          # code_changed=true (전 가드 실행 방향으로만 기움).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # pull_request checkout = merge commit → base tip 과의 diff 가 PR 실효 변경 전체
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files.txt
            else
              echo "::warning::base sha fetch 실패 — fail-safe: 전체 코드 취급"
              : > /tmp/changed-files.txt
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
              git diff --name-only "$BEFORE" "${{ github.sha }}" > /tmp/changed-files.txt
            else
              echo "::warning::push before sha 미해석 (신규 브랜치/force-push) — fail-safe: 전체 코드 취급"
              : > /tmp/changed-files.txt
            fi
          fi
          echo "── 변경 파일 목록 ──"
          cat /tmp/changed-files.txt
          node scripts/ci-diff-scope.mjs --files-from /tmp/changed-files.txt

      # #915 범위 5 — CHANGELOG soft-warn (차단 아님 — exit 0 유지).
      # [Unreleased] 소급 작성 3회 재발 이력의 구조 가드. 코드 변경 (apps/**·packages/**·
      # scripts/**) 이 있는데 CHANGELOG.md 미포함이면 warning annotation 만 남긴다.
      - name: CHANGELOG soft-warn
        if: github.event_name == 'pull_request' && steps.scope.outputs.app_code_changed == 'true' && steps.scope.outputs.changelog_touched != 'true'
        run: |
          echo "::warning::코드 변경 (apps/**·packages/**·scripts/**) 이 있으나 CHANGELOG.md 미갱신 — [Unreleased] entry 추가를 검토하세요 (#915 soft-warn, 차단 아님)."

  detect-and-test:
    runs-on: ubuntu-latest
    # #915 — 무거운 구간 (빌드 + 브라우저 가드) 은 diff-scope 출력으로 step 단위 게이트.
    # job 전체를 스킵하지 않는 이유: verify:zombie-check / verify:dead-wait-check 등 SSoT
    # 가드는 CLAUDE.md·.claude/** (docs 분류) 변경으로도 깨질 수 있어 상시 실행이 필요하다
    # (docs-only 에서 job 통스킵 = 해당 가드 약화). 상시 스텝은 총 ~2분 내 (docs-only DoD 정합).
    needs: diff-scope
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # pnpm 모노레포 고정 경로 (#915 범위 7 — 범용 언어 자동 감지 제거)
      # ============================================================
      # 구 범용 템플릿의 yarn/npm/Python(uv·poetry·pipenv·pip)/Go/Rust/Makefile 감지 분기
      # ~190줄은 전부 도달 불가였다 — 실측 (2026-08-01): 각 분기의 트리거 파일 (yarn.lock /
      # package-lock.json / uv.lock / poetry.lock / Pipfile.lock / pyproject.toml / setup.py /
      # requirements.txt / go.mod / 루트 Cargo.toml / Makefile) 이 루트에 전부 부재.
      # Rust 는 ci-physics-wasm.yml 이 manifest-path 명시로 전담 (루트 Cargo.toml 없음 →
      # ci.yml rust step 은 한 번도 발화한 적 없음). #840 "CI 통과 ≠ 테스트 실행" 클래스의
      # 근원 (죽은 조건 분기) 제거 — 상세 증명은 PR #915 PR-1 본문 박제.
      # pnpm 스텝의 구 hashFiles('pnpm-lock.yaml') 조건도 감지 잔재라 제거 — lockfile 소실은
      # 조용한 스킵이 아니라 결정적 FAIL 이어야 한다 (#901 fail-fast 정합).

      - name: pnpm setup
        uses: pnpm/action-setup@v4

      - name: Node.js setup (pnpm)
        uses: actions/setup-node@v4
        with:
          # #606 fix (ADR 20260531-606 §Amendment 2) — playwright 1.59.1 extract 가
          #   Node 24.16 환경에서 deadlock ("extracting archive" 후 I/O 0바이트 5분 hang).
          #   engines.node ">=20.0.0" 범위 해석은 setup-node 가 최신 24.16 을 설치 → freeze.
          #   #666 (Amendment 4): 정확 버전 중앙 파일 `.node-version` (22.16.0) 로 일원화.
          #   정확 버전이라 범위 해석 함정 회피 (Amendment 3 "전수 명시 핀" 정책 양립).
          #   재검토: playwright 업그레이드로 Node 24 extract 호환 확인되면 .node-version 갱신.
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # #915 — CI 인프라 스크립트 self-test 상시 배선 (#897 교훈: CI 미배선 self-test = 0회 실행).
      # diff-scope 분류기는 diff-scope job 이 사용 직전 자기 검증 — 여기서는 auto-close 파서만.
      # (auto-close-issues.yml 은 머지 이벤트에만 돌므로 PR 단계 상시 검증은 본 스텝이 담당.)
      - name: '#915 auto-close 파서 self-test'
        run: node scripts/auto-close-issue-parser.mjs --self-test

      # #840 — 단위 테스트 (vitest) 는 ci-physics-wasm.yml verify-and-rust job 에 배선.
      # 구 'pnpm run --if-present test' 는 harness bb220d3 (2026-04-20) 루트 test→test:unit
      # 리네임 후 silent no-op (출력 없이 exit 0) 으로 약 3개월 미실행이었다.
      # 본 job 에 두지 않는 근거: core 가 @astro-simulator/physics-wasm (pkg/, gitignored)
      # 을 소스 4파일에서 직접 import 하므로 wasm-pack 빌드가 선행 조건 — Rust 툴체인이
      # 이미 있는 verify-and-rust job 이 유일한 저비용 배선 지점 (전 워크스페이스 94파일 커버).

      # P12-C #298 — 단일 모드 전환 회귀 가드 (R1 DoD).
      # `scientific` 식별자·리터럴이 활성 코드 경로에 재도입되면 exit 1 로 차단.
      # 주석(역사 맥락)은 허용. 자세한 규칙은 scripts/verify-no-scientific-grep.mjs 헤더 참조.
      - name: R1 회귀 가드 (verify:no-scientific-grep)
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/verify-no-scientific-grep.mjs') != ''
        run: pnpm run --if-present verify:no-scientific-grep

      # #440 dev 서버 좀비 incident SSoT 박제 회귀 가드.
      # CLAUDE.md 가드 A/B sub-section / qa.md 좀비 카나리아 / hook 파일 / forensic 보고서 5건 정합 검증.
      # 박제가 의도치 않게 제거되면 exit 1 로 차단. 근거: docs/reports/20260510-419-dev-server-zombie-recurrence.md
      - name: '#440 dev 서버 좀비 SSoT 회귀 가드 (verify:zombie-check)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/verify-zombie-check.mjs') != ''
        run: pnpm run --if-present verify:zombie-check

      # #817 세션 중단 dead-wait 가드 (가드 D) SSoT 박제 + self-test 회귀 가드.
      # CLAUDE.md 가드 D / settings.json hook 등록 / hook 파일 / ADR / sidecar 5건 정합 +
      # --self-test 3중 시뮬(positive→negative→recovery)로 hook 동작 실측 검증.
      # 근거: docs/decisions/20260710-817-dead-wait-guard.md
      - name: '#817 세션 dead-wait 가드 SSoT + self-test (verify:dead-wait-check)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/verify-dead-wait-check.mjs') != ''
        run: |
          pnpm run --if-present verify:dead-wait-check
          node scripts/verify-dead-wait-check.mjs --self-test

      # #842 docs 링크 가드 self-test 회귀 가드.
      # 체커 자체의 검출 능력(positive→negative→recovery 3중 시뮬 + file:// / 영문 Status: /
      # deprecated 스캔 제외 단위 케이스)을 fixture 격리로 상시 실측 — 체커가 조용히
      # 무력화되는 회귀(#338 hashFiles silent skip 재발 클래스) 차단.
      # 본검사(전수 스캔, fail-fast)는 project-guards.yml "docs 상대 링크 무결성 가드" 담당.
      # `--if-present` 미사용 (#840 silent no-op 함정) — 스크립트 부재 시 결정적 FAIL.
      - name: '#842 docs 링크 가드 self-test (verify-docs-links --self-test)'
        run: node scripts/verify-docs-links.mjs --self-test

      # #846 browser-verify 공용 헬퍼 (launchBrowser / bootstrapScene / collectConsoleErrors /
      # saveCapture / resolveBaseUrl) 회귀 가드. 브라우저를 띄우지 않는 stand-alone node 테스트
      # (루트 scripts/ 는 vitest workspace 밖 — bench-aggregate-median.test.mjs 선례).
      # `--if-present` 미사용 (#840 silent no-op 함정) — 스크립트 부재 시 결정적 FAIL.
      - name: '#846 browser-verify 헬퍼 회귀 가드 (browser-verify-utils.test)'
        run: node scripts/browser-verify-utils.test.mjs

      # ============================================================
      # R1 UI 회귀 가드 — wasm-pack + Playwright + pixel diff
      # ============================================================
      # ADR: docs/decisions/20260425-r1-ui-pixel-diff-guard.md §Amendment v3 2026-04-26
      # 의존성:
      #   - physics-wasm 워크스페이스 → wasm-pack (root recursive `pnpm build` 트리거)
      #   - apps/web → next start (Playwright BASE_URL 타깃)
      #   - apps/web/scripts/__baselines__/r1/ Linux 캡처본 12장 (PR #351 머지 후 정합)

      # ============================================================
      # #606 r1-guard step 4분리 (install / build / start / verify)
      # ============================================================
      # ADR 20260531-606 §Amendment 2: 가설 1~5 (scene/satellite/verify/build) 전부 오진.
      #   measurement-first 4단계 진단으로 root cause 확정:
      #   1) step 분리 → install(1/4) 이 freeze 지점 (build/verify 미도달, run 26753107929)
      #   2) DEBUG=pw:install → "extracting archive" 직후 hang, download 는 success (run 26753862359)
      #   3) disk/mem/node 폴링 → 자원 전부 정상 (88G avail / 14Gi mem / Node 24.16),
      #      extract I/O 0바이트 deadlock (run 26756305719)
      #   4) Node 22 핀 → install 28초 통과 → Node 24.16 + playwright 1.59.1 extract
      #      비호환 확정 (run 26756788369). fix: Node 22 LTS 핀 — 현재는 위 "Node.js setup (pnpm)"
      #      step 의 node-version-file (.node-version) 로 일원화 (#666, 라인 번호 참조는 drift 하므로
      #      서술형으로 정리 — #814).
      # step 분리는 fix 후에도 유지 — freeze 재발 시 즉시 step 단위 격리 (ADR 옵션 f 정합).
      # #802: 1/4 (Playwright 캐시+설치) · 2/4 (build) 는 rust/wasm-pack 툴체인과 함께
      #   setup-and-build composite 내부 sub-step 으로 이동 (분리 구조는 composite 내부에
      #   그대로 유지 — freeze 재발 시 sub-step 로그로 지점 격리 가능). 3/4 · 4/4 는 아래 유지.

      - name: 'r1-guard: 툴체인 + Playwright + build (composite #802)'
        # 조건 통합 (#802): 기존 step 별 hashFiles 조건 중 rust-toolchain.toml /
        #   packages/physics-wasm/Cargo.toml 은 본 저장소에서 전부 상시 참 → 지배 조건
        #   (pnpm-lock + r1-guard 스크립트) 으로 통합. 현 저장소 상태 기준 행동 변화 0.
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # 기존 step 별 timeout (Playwright 설치 5분 + build 8분) 을 invocation 단일 20분으로 승계
        # (composite 내부 step 은 timeout-minutes 미지원). rust 툴체인/캐시 복원 시간까지 포함한 상한.
        timeout-minutes: 20
        uses: ./.github/actions/setup-and-build
        with:
          # pnpm/node/install 은 위 "pnpm 경로" 구간이 이미 수행 — 재수행 생략
          setup-node: 'false'

      - name: 'r1-guard: next start 기동 + readiness (3/4)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # start + readiness 단독 timeout — stuck 시 production 런타임 초기화 freeze 확정.
        # setsid 로 띄워 step 종료 시 SIGHUP 으로 죽지 않도록 (다음 verify step 에서 사용).
        timeout-minutes: 3
        run: |
          setsid pnpm --filter @astro-simulator/web start -p 3001 > /tmp/r1-web.log 2>&1 &
          echo $! > /tmp/r1-web.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3001/ > /dev/null; then echo "READY after ${i}x2s"; break; fi
            sleep 2
          done
          curl -sf http://localhost:3001/ > /dev/null || { echo "::error::next start readiness 실패"; cat /tmp/r1-web.log; exit 1; }

      - name: 'r1-guard: verify 실행 (4/4)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # verify 단독 timeout — stuck 시 Playwright/런타임 verify 경로 freeze 격리.
        # R1_GUARD_DIAG=1 — verify 경로 단계별 stderr 진단 로깅 상시 활성화 (freeze 재발 시
        #   stuck 직전 단계 즉시 보존, 성공 시 stderr 노이즈 무시. ADR §Amendment 2 정합).
        timeout-minutes: 5
        env:
          R1_GUARD_DIAG: '1'
        # #846 — Actions run step 기본 셸은 `bash -e {0}` 라, 가드가 실패하면 그 줄에서 step 이
        #   즉시 종료된다. 즉 기존의 `GUARD_EXIT=$?` / `kill` / `exit $GUARD_EXIT` 3행은
        #   **성공 시에만 실행되는 죽은 코드** 였고, 정작 정리가 필요한 실패 경로에서 next start
        #   프로세스가 job 끝까지 살아남았다 (로컬 `bash -e` 재현으로 실측).
        #   `set +e` 로 판정 구간만 -e 를 끄고, 정리는 성공/실패 양쪽에서 실행되게 한다.
        run: |
          set +e
          BASE_URL=http://localhost:3001 node apps/web/scripts/r1-ui-regression-guard.mjs
          GUARD_EXIT=$?
          set -e
          kill "$(cat /tmp/r1-web.pid)" 2>/dev/null || true
          exit $GUARD_EXIT

      - name: R1 diff 이미지 업로드 (실패 시)
        if: failure() && hashFiles('apps/web/scripts/__diff__/r1/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: r1-pixel-diff-${{ github.run_id }}
          path: apps/web/scripts/__diff__/r1/
          retention-days: 7

      # ============================================================
      # #846 — dev 서버 1회 기동 (아래 브라우저 회귀 가드 전부 공용)
      # ============================================================
      # 기존: 각 가드가 `next dev -p 3002~3013 &` + readiness 루프 + kill 4행 세트를
      #   포트만 바꿔 복제 → PR 1건당 next cold-boot 이 가드 수만큼 반복됐다.
      #   가드끼리 병렬로 도는 구조가 아니라 **같은 job 안의 직렬 step** 이므로 포트 분리는
      #   애초에 불필요했다 (로컬 실측: `kill $WEB_PID` 는 pnpm 래퍼를 거쳐 next 자식까지
      #   정상 종료시킨다 — 즉 성공 경로에서 포트는 곧바로 반납됐다. 포트 증분은 복붙 산물).
