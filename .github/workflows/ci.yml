      # cross-validate G3 수용 — "사용자 D-T2 재발견 비용 > CI 시간 비용" ROI 명백
      # 매트릭스 실측 (2026-08-01, #915): FOCUS_BODIES 32 body × 2 모드 = 64 cells
      # (R3 시점 6 cells → R12 누적. 이슈 #915 의 "r1-guard 64셀" 은 본 verify:378-focus 매트릭스).
      #
      # #915 범위 2 — PR 경로 대표 8셀 축소 (가드 약화 아님 — 실행 시점 이동):
      #   전체 64셀은 develop/main push 에서 그대로 유지 (squash 머지 후 push sha 가 PR head sha
      #   와 달라 concurrency dedupe 에 걸리지 않음 — 머지 즉시 전셀 검증).
      # 대표 8셀 선정 근거 (각 축 최소 1 커버, ':' 구분 — body id 에 하이픈 포함되므로):
      #   sun:observe      — 항성 (T1 유지 특례 body)
      #   venus:observe    — 내행성 + #378 원 D-T2 회귀 재현 케이스 (observe 가 FAIL 이력)
      #   venus:research   — mode 축 (research 패널 resize 경로) — 원 회귀 body 로 양 모드 커버
      #   phobos:observe   — 고각속도 위성 (#611 한 프레임 lag 회귀 클래스 — 가장 민감한 셀)
      #   jupiter:observe  — 거성 (tier 스케일 상단)
