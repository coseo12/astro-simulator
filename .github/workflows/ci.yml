      #          (S3) WASD 1 step screen px ≤ 16 + tier 편차 < 10% (계수 0.05 과대 회귀 차단)
      #          (S3b) frame-rate 독립 — hold 시간 비례 이동 (deltaTime 정규화 누락 회귀 차단)
      #          (S4) 무회귀 — free-fly originOffset=0(#693) + tier 줌아웃 escalate(#629/#631)
      - name: '#699 free-fly 통합 재설계 회귀 가드 (verify:699-freefly-unified)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-699-freefly-unified.mjs') != ''
        run: |
          # #779 Phase 2 — S3b deltaTime 타이밍 flake 흡수 (v0.39.0 / v0.43.0 prep 실측 2회 — 브라우저 회귀 가드 중 유일).
          # dev server 는 유지한 채 guard 호출만 재시도 (#709 동일 패턴). 2연속 fail = step fail (fail-fast 유지).
          # #846: 공용 dev 서버(:3002)를 쓰므로 "dev server 는 유지" 전제가 구조적으로 보장된다.
          #   재시도 루프는 `if ... ; then` 형태라 bash -e 에 걸리지 않는다 (변환 전에도 정상 동작).
          GUARD_EXIT=1
          for attempt in 1 2; do
            echo "::group::verify:699 attempt $attempt/2"
            if BASE_URL=http://localhost:3002 node apps/web/scripts/browser-verify-699-freefly-unified.mjs; then
              GUARD_EXIT=0
              echo "::endgroup::"
              if [[ $attempt -eq 2 ]]; then
                echo "::warning::verify:699 attempt 1 실패를 attempt 2 가 흡수 — runner 부하 spike flake 추정 (#779 Phase 2)"
              fi
              break
            fi
            echo "::endgroup::"
            if [[ $attempt -lt 2 ]]; then
              echo "::warning::verify:699 attempt $attempt 실패 — 15s 후 재시도 (#779 Phase 2)"
              sleep 15
            fi
          done
          exit $GUARD_EXIT

