      #   `if: always()` step 이 단독 책임 — 개별 step 의 kill 은 **실패 경로에서 도달하지
      #   않는** 죽은 코드였고(`bash -e {0}`), 그때만 서버가 job 끝까지 잔존했다.
      # 개수 표기는 의도적으로 쓰지 않는다 (#935) — 가드 추가 PR 마다 손으로 갱신해야 하고
