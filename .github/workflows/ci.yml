name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # Node.js 생태계 (pnpm > yarn > npm lock > npm fallback)
      # ============================================================
      # 패키지 매니저 우선순위: pnpm-lock.yaml > yarn.lock > package-lock.json > (lock 없음, npm fallback)
      # 배타 조건 분기 — 각 경로는 다른 경로의 lock 파일이 없을 때만 실행
      #
      # setup-node@v4 는 cache: 'npm'/'pnpm'/'yarn' 지정 시 해당 lock 부재면 step 실패하므로 분기 필수
      # — volt #51 Gemini 단일화 권고 실측 오탐 확인, 다중 step 유지

      - name: Node.js 프로젝트 감지
        if: hashFiles('package.json') != ''
        run: |
          node_version=$(jq -r '.engines.node // "20"' package.json | grep -oE '[0-9]+' | head -1)
          echo "Node.js ${node_version} 사용"

      # --- pnpm 경로 ---
      - name: pnpm setup
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4

      - name: Node.js setup (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: pnpm install
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        if: hashFiles('pnpm-lock.yaml') != ''
        # `pnpm run --if-present <script>` 는 pnpm 8+ 공식 지원. `--if-present` 를
        # pnpm 의 플래그로 인식하여 script args 로 forward 하지 않는다.
        # 반대로 `pnpm test --if-present` 는 `--if-present` 가 script args 로 전달되어
        # 모노레포의 `pnpm -r test --if-present` 형태가 되고, vitest/jest 등 런너가
        # 알 수 없는 옵션으로 실패 (#181).
        run: pnpm run --if-present test

      # P12-C #298 — 단일 모드 전환 회귀 가드 (R1 DoD).
      # `scientific` 식별자·리터럴이 활성 코드 경로에 재도입되면 exit 1 로 차단.
      # 주석(역사 맥락)은 허용. 자세한 규칙은 scripts/verify-no-scientific-grep.mjs 헤더 참조.
      - name: R1 회귀 가드 (verify:no-scientific-grep)
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/verify-no-scientific-grep.mjs') != ''
        run: pnpm run --if-present verify:no-scientific-grep

      # #440 dev 서버 좀비 incident SSoT 박제 회귀 가드.
      # CLAUDE.md 가드 A/B sub-section / qa.md 좀비 카나리아 / hook 파일 / forensic 보고서 5건 정합 검증.
      # 박제가 의도치 않게 제거되면 exit 1 로 차단. 근거: docs/reports/20260510-419-dev-server-zombie-recurrence.md
      - name: '#440 dev 서버 좀비 SSoT 회귀 가드 (verify:zombie-check)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('scripts/verify-zombie-check.mjs') != ''
        run: pnpm run --if-present verify:zombie-check

      # ============================================================
      # R1 UI 회귀 가드 — wasm-pack + Playwright + pixel diff
      # ============================================================
      # ADR: docs/decisions/20260425-r1-ui-pixel-diff-guard.md §Amendment v3 2026-04-26
      # 의존성:
      #   - physics-wasm 워크스페이스 → wasm-pack (root recursive `pnpm build` 트리거)
      #   - apps/web → next start (Playwright BASE_URL 타깃)
      #   - apps/web/scripts/__baselines__/r1/ Linux 캡처본 12장 (PR #351 머지 후 정합)

      - name: Rust 툴체인 설정 (R1 r1-guard 의존)
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != '' && hashFiles('rust-toolchain.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          targets: wasm32-unknown-unknown

      - name: Rust 빌드 캐시 (R1 r1-guard 의존)
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('packages/physics-wasm/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/physics-wasm

      - name: wasm-pack 설치 (R1 r1-guard 의존)
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('packages/physics-wasm/Cargo.toml') != ''
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      # ============================================================
      # #606 진단 — r1-guard step 4분리 (install / build / start / verify)
      # ============================================================
      # 배경: ADR 20260531-606 가설 5 (8 body 측정 freeze) 는 verify 모드가
      #   measureBodyPxRatios 를 호출하지 않으므로 dead code 오진. 진짜 freeze 지점
      #   (build / start / verify-런타임) 을 step 단위로 격리하기 위해 분리.
      # 기존 단일 step + timeout-minutes:10 (옵션 b) 은 build/start/verify 중 어디서
      #   stuck 인지 격리 불가 (buffering 으로 stdout 도 유실). step 분리 시 GitHub Actions
      #   UI 가 step 별 소요시간 + timeout 위치를 명확히 표시 → freeze 지점 확정.
      # 머지 후 CI run 1회로 측정 → ADR Amendment 2 박제 + root cause fix 후속 PR.

      - name: 'r1-guard: Playwright Chromium 설치 (#606 진단 1/4)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # #606 진단 2차 — freeze 가 chromium zip 다운로드 100% 직후 extract 인지
        #   2차 다운로드(chromium-headless-shell) 인지 격리. DEBUG=pw:install 로 playwright
        #   내부 단계(download/extract 시작·완료)를 stderr 실시간 로깅 + install-deps(apt) 와
        #   install(브라우저 본체) 분리로 stuck 단계 step 내 구분.
        #   1차 진단(run 26753107929): 다운로드 100% 후 5분 침묵 → extract/post-download stuck 확정.
        timeout-minutes: 5
        env:
          DEBUG: 'pw:install'
        run: |
          echo "=== #606 진단 3차 — extract hang 원인 좁히기 (disk/mem/node) ===" >&2
          echo "[node] $(node --version)" >&2
          echo "[disk] (extract 전)" >&2; df -h / /tmp >&2
          echo "[mem]" >&2; free -h >&2
          echo "[cpu] nproc=$(nproc)" >&2
          echo "::group::install-deps (apt — 1차 진단에서 통과 확인됨)" >&2
          pnpm exec playwright install-deps chromium
          echo "::endgroup::" >&2
          echo "=== install chromium 본체 시작 (DEBUG=pw:install, 백그라운드 + 디스크 폴링) ===" >&2
          pnpm exec playwright install chromium &
          PWPID=$!
          # extract hang 중 디스크 추이 폴링 — full 로 차오르다 멈추면 디스크 원인,
          # 여유 있는데 hang 이면 Node/playwright extract 로직 원인.
          while kill -0 "$PWPID" 2>/dev/null; do
            echo "[disk-poll $(date -u +%H:%M:%S)] $(df -h / | tail -1)" >&2
            sleep 15
          done
          wait "$PWPID"
          echo "=== install chromium 완료 ===" >&2

      - name: 'r1-guard: production build (#606 진단 2/4)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # build 단독 timeout — stuck 시 scene 코드 (R5 mars/phobos/deimos) prerender 무한 루프 확정
        timeout-minutes: 8
        run: pnpm build

      - name: 'r1-guard: next start 기동 + readiness (#606 진단 3/4)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # start + readiness 단독 timeout — stuck 시 production 런타임 초기화 freeze 확정.
        # setsid 로 띄워 step 종료 시 SIGHUP 으로 죽지 않도록 (다음 verify step 에서 사용).
        timeout-minutes: 3
        run: |
          setsid pnpm --filter @astro-simulator/web start -p 3001 > /tmp/r1-web.log 2>&1 &
          echo $! > /tmp/r1-web.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3001/ko > /dev/null; then echo "READY after ${i}x2s"; break; fi
            sleep 2
          done
          curl -sf http://localhost:3001/ko > /dev/null || { echo "::error::next start readiness 실패"; cat /tmp/r1-web.log; exit 1; }

      - name: 'r1-guard: verify 실행 (#606 진단 4/4)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/r1-ui-regression-guard.mjs') != ''
        # verify 단독 timeout — stuck 시 Playwright/런타임 verify 경로 freeze 확정.
        # R1_GUARD_DIAG=1 — verify 경로 단계별 stderr 진단 로깅 활성화 (stuck 직전 단계 보존).
        timeout-minutes: 5
        env:
          R1_GUARD_DIAG: '1'
        run: |
          BASE_URL=http://localhost:3001 node apps/web/scripts/r1-ui-regression-guard.mjs
          GUARD_EXIT=$?
          kill "$(cat /tmp/r1-web.pid)" 2>/dev/null || true
          exit $GUARD_EXIT

      - name: R1 diff 이미지 업로드 (실패 시)
        if: failure() && hashFiles('apps/web/scripts/__diff__/r1/**/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: r1-pixel-diff-${{ github.run_id }}
          path: apps/web/scripts/__diff__/r1/
          retention-days: 7

      # ============================================================
      # #378 focus 회귀 가드 — focus 시 허공 표시 차단
      # ============================================================
      # ADR: docs/decisions/20260503-378-focus-frustum-fix.md §결과·재검토 조건 §회귀 가드
      # cross-validate G3 수용 — "사용자 D-T2 재발견 비용 > CI 시간 비용" ROI 명백
      # 12 cells (6 body × 2 모드) 매트릭스 — venus 관찰 모드 PASS 확인
      # next start 는 R1 가드 step 에서 이미 build/start 완료되므로 dev 빌드 별도 기동 필요.
      # __solarScene 핸들이 dev 빌드 한정 노출 (sim-canvas.tsx:253) 이므로 next dev 사용.

      - name: '#378 focus 회귀 가드 (verify:378-focus)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-378-focus.mjs') != ''
        run: |
          pnpm --filter @astro-simulator/web exec next dev -p 3002 &
          WEB_PID=$!
          for i in {1..60}; do
            if curl -sf http://localhost:3002/ > /dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://localhost:3002 node apps/web/scripts/browser-verify-378-focus.mjs
          GUARD_EXIT=$?
          kill $WEB_PID || true
          exit $GUARD_EXIT

      # ============================================================
      # #408 focus transition 회귀 가드 — tier oscillate 차단 (사용자 D-T2 2026-05-04)
      # ============================================================
      # ADR: docs/decisions/20260504-focus-tier-oscillate-fix.md §결정 5 (회귀 가드 신설)
      # 9 cells (3 from × 3 to) 매트릭스 — venus → mercury 등 다른 행성 전환 시 oscillate 차단 확인
      # tier 전환 횟수 ≤ 1 / target origin reset 0 / camR jump > 1000 unit 0 단언
      # __solarScene + __simCore.sendCommand 핸들이 dev 빌드 한정 노출이므로 next dev 재사용.

      - name: '#408 focus transition 회귀 가드 (verify:focus-transition)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-focus-transition.mjs') != ''
        run: |
          pnpm --filter @astro-simulator/web exec next dev -p 3003 &
          WEB_PID=$!
          for i in {1..60}; do
            if curl -sf http://localhost:3003/ > /dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://localhost:3003 node apps/web/scripts/browser-verify-focus-transition.mjs
          GUARD_EXIT=$?
          kill $WEB_PID || true
          exit $GUARD_EXIT

      # ============================================================
      # #402 R-Phase Allowlist 자동화 hook — exports field WASM 도메인 sub-path 금지
      # ============================================================
      # ADR: docs/decisions/20260504-r-phase-allowlist-guard.md §Amendment 결정 D2
      # 라운드 1 회귀 (PR #407, turbopack ${__dirname} SSR 500) 직접 가드.
      # jq 로 packages/core/package.json exports field 검사. WASM 의존 도메인 sub-path 추가 시 차단.

      - name: '#402 core exports immutable 가드 (verify-core-exports-immutable.sh)'
        if: hashFiles('scripts/verify-core-exports-immutable.sh') != '' && hashFiles('packages/core/package.json') != ''
        run: bash scripts/verify-core-exports-immutable.sh

      # ============================================================
      # #402 R-Phase Allowlist 회귀 가드 — UI disabled + scene-level 강제 click 차단
      # ============================================================
      # ADR: docs/decisions/20260504-r-phase-allowlist-guard.md §결정 4 (DoD-4)
      # 매트릭스: 박제 body (sun/mercury/venus) 활성 + 미박제 body (earth/jupiter/neptune) disabled
      # + 강제 click 시 store/camera 변화 0 (defense-in-depth scene 측면)

      - name: '#402 R-Phase allowlist 회귀 가드 (verify:r-phase-allowlist)'
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-r-phase-allowlist.mjs') != ''
        run: |
          pnpm --filter @astro-simulator/web exec next dev -p 3004 &
          WEB_PID=$!
          for i in {1..60}; do
            if curl -sf http://localhost:3004/ > /dev/null; then break; fi
            sleep 2
          done
          BASE_URL=http://localhost:3004/ko node apps/web/scripts/browser-verify-r-phase-allowlist.mjs
          GUARD_EXIT=$?
          kill $WEB_PID || true
          exit $GUARD_EXIT

      # --- yarn 경로 (pnpm-lock 없을 때만) ---
      # yarn berry (v2+) vs classic (v1) 감지:
      # - `.yarnrc.yml` 존재 → berry → `yarn install --immutable` (v2+ 필수, v4+ 는 --frozen-lockfile 제거)
      # - `.yarnrc.yml` 부재 → classic (v1) → `yarn install --frozen-lockfile`
      # setup-node cache: 'yarn' 은 양쪽 모두 지원
      - name: Node.js setup (yarn)
        if: hashFiles('yarn.lock') != '' && hashFiles('pnpm-lock.yaml') == ''
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'yarn'

      - name: Enable corepack (yarn packageManager field 우선)
        if: hashFiles('yarn.lock') != '' && hashFiles('pnpm-lock.yaml') == ''
        run: corepack enable

      - name: yarn install (berry — .yarnrc.yml 존재)
        if: hashFiles('yarn.lock') != '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('.yarnrc.yml') != ''
        run: yarn install --immutable

      - name: yarn install (classic — .yarnrc.yml 부재)
        if: hashFiles('yarn.lock') != '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('.yarnrc.yml') == ''
        run: yarn install --frozen-lockfile

      - name: yarn test
        if: hashFiles('yarn.lock') != '' && hashFiles('pnpm-lock.yaml') == ''
        # `yarn test` 는 berry/classic 모두 `scripts.test` 실행. --if-present 없으므로 스킵 시 실패
        # → scripts.test 부재일 때를 위해 조건 체크 (node -e 로 파싱)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            yarn test
          else
            echo "scripts.test 미정의 — skip"
          fi

      # --- npm 경로 (pnpm/yarn lock 없을 때만) ---
      - name: Node.js setup (lockfile 있음, npm cache 활성)
        if: hashFiles('package-lock.json') != '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('yarn.lock') == ''
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Node.js setup (lockfile 없음, cache 비활성)
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('yarn.lock') == ''
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: npm ci (lockfile 있을 때)
        if: hashFiles('package-lock.json') != '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('yarn.lock') == ''
        run: npm ci

      - name: npm install (lockfile 없을 때 fallback)
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('yarn.lock') == ''
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: npm test
        if: hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') == '' && hashFiles('yarn.lock') == ''
        run: npm test --if-present

      # ============================================================
      # Python 생태계 (uv > poetry > pipenv > pip / requirements)
      # ============================================================
      # 패키지 매니저 우선순위: uv.lock > poetry.lock > Pipfile.lock > pyproject.toml (pip) > requirements.txt
      # 배타 조건 — 하나만 실행
      # `pytest --if-present` 같은 flag 는 없으므로, scripts.test 유무 검사 대신 pytest 가 수집한 테스트 0 건이어도 exit 5 를
      # warning 으로 처리 (`pytest || [ $? = 5 ]`) — pytest 없는 프로젝트는 해당 step 자체가 실행되지 않도록 lock/config 감지 기반

      - name: Python 프로젝트 감지
        if: hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('requirements.txt') != ''
        run: echo "Python 프로젝트 감지됨"

      # --- uv 경로 ---
      # 공식 astral-sh/setup-uv action 사용 — `curl | sh` 패턴 대비 (a) 버전 고정 (b) 캐싱 (c) MITM/공급망 공격 표면 축소
      # Gemini cross-validate (PR #178) 보안 권고 수용
      - name: uv setup
        if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync + pytest (uv.lock)
        if: hashFiles('uv.lock') != ''
        run: |
          uv sync --frozen
          uv run --no-sync pytest || [ $? = 5 ]

      # --- poetry 경로 ---
      # NOTE (reviewer #178 권고 반영):
      # - setup-python cache 지시어를 설치 도구 정의 시점에 쓰면 첫 실행에서 캐시 스킵 경고 발생 (도구 미존재).
      #   → `cache:` 는 도구 설치 후 별도 재설정이 이상적이나 action 한계상 생략하고 캐시 없이 진행
      # - `python-version-file: 'pyproject.toml'` 는 `[project].requires-python` 또는 `[tool.poetry].python` 필드 부재 시 실패.
      #   → python-version '3.x' 로 fallback (프로젝트가 특정 버전 고정 원하면 pyproject.toml 에 직접 명시)
      # - `poetry install` 이 dev-dependencies 에 pytest 를 포함한다고 암묵 전제하면 `poetry run pytest` 가 command not found.
      #   → `poetry install` 이후 `poetry run python -c 'import pytest'` 로 감지 실패 시 `poetry run pip install pytest` 로 명시 보강
      - name: Python setup (poetry)
        if: hashFiles('poetry.lock') != '' && hashFiles('uv.lock') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: poetry install + pytest
        if: hashFiles('poetry.lock') != '' && hashFiles('uv.lock') == ''
        run: |
          pipx install poetry || pip install --user poetry
          poetry install --no-interaction --no-ansi
          poetry run python -c "import pytest" 2>/dev/null || poetry run pip install pytest
          poetry run pytest || [ $? = 5 ]

      # --- pipenv 경로 ---
      # NOTE (reviewer #178 권고 반영): Pipfile python_version 필드 부재 시 setup-python 실패 가능 → '3.x' fallback.
      # pipenv sync --dev 도 dev-packages 에 pytest 없으면 `pipenv run pytest` 가 실패 → 감지 후 명시 설치
      - name: Python setup (pipenv)
        if: hashFiles('Pipfile.lock') != '' && hashFiles('uv.lock') == '' && hashFiles('poetry.lock') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: pipenv install + pytest
        if: hashFiles('Pipfile.lock') != '' && hashFiles('uv.lock') == '' && hashFiles('poetry.lock') == ''
        run: |
          pip install --user pipenv
          pipenv sync --dev
          pipenv run python -c "import pytest" 2>/dev/null || pipenv run pip install pytest
          pipenv run pytest || [ $? = 5 ]

      # --- pip 경로 (requirements.txt 또는 pyproject.toml 의 PEP 621 메타데이터) ---
      # 배타 조건: uv.lock / poetry.lock / Pipfile.lock 모두 없을 때. 세 가지 감지 파일 중 하나 이상 있으면 실행:
      #   1) requirements.txt (우선) → pip install -r
      #   2) pyproject.toml → pip install -e .[dev] 시도 → 실패 시 pip install -e .
      #   3) setup.py (legacy) → pip install -e .
      # pyproject.toml 이 if 조건과 run 분기 양쪽에 등장하는 이유: uv/poetry 가 아닌 단순 PEP 621 프로젝트도 pip 가 처리
      - name: Python setup (pip / pyproject)
        if: (hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('requirements.txt') != '') && hashFiles('uv.lock') == '' && hashFiles('poetry.lock') == '' && hashFiles('Pipfile.lock') == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: pip install + pytest (requirements.txt 우선)
        if: (hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '') && hashFiles('uv.lock') == '' && hashFiles('poetry.lock') == '' && hashFiles('Pipfile.lock') == ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .[dev] 2>/dev/null || pip install -e .
          elif [ -f setup.py ]; then
            pip install -e .
          fi
          pip install pytest
          # pytest exit 5 = "no tests collected" — 경고로 처리
          pytest || [ $? = 5 ]

      # ============================================================
      # Go 생태계
      # ============================================================
      - name: Go setup
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go test
        if: hashFiles('go.mod') != ''
        run: go test ./...

      # ============================================================
      # Rust 생태계
      # ============================================================
      # cargo test --lib 기본 실행 (debug 빌드). 장기 테스트 이원화 (volt #54) 는 다운스트림이
      # 별도 test-long-integration job 으로 확장 — 본 step 은 일상 경로만
      # NOTE (reviewer #178 권고 반영): 기존 `--release` 옵션은 "일상 경로" 의도와 상충 (일상은 빠른 debug 빌드).
      # release 빌드 검증이 필요한 프로젝트는 별도 job 에서 `cargo test --release --lib` 실행 권장.
      - name: Rust toolchain setup
        if: hashFiles('Cargo.toml') != ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: cargo test (일상 경로, --lib, debug)
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --lib

      # ============================================================
      # 기타 (Makefile 폴백)
      # ============================================================
      - name: Make 테스트
        if: hashFiles('Makefile') != ''
        run: |
          if grep -q "^test:" Makefile; then
            make test
          fi

      # ============================================================
      # NOTE: harness 저장소 전용 가드는 `.github/workflows/harness-guards.yml` 로 이동됨
      # (v3.0.0, harness #196). 다운스트림은 본 ci.yml 을 자유롭게 수정해도 업스트림과 충돌하지 않는다.
      # 마이그레이션: docs/harness-ci-migration.md
      # ============================================================
