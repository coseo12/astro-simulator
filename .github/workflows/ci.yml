      #   halley:observe   — 혜성 (고이심률 e 0.967 + 역행)
      # 셀 id 오타는 스크립트가 fail-fast (exit 2) — 조용한 매트릭스 축소 불가.

      - name: '#378 focus 회귀 가드 (verify:378-focus)'
        if: needs.diff-scope.outputs.code_changed == 'true' && hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/web/scripts/browser-verify-378-focus.mjs') != ''
        run: |
