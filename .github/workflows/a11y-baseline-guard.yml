name: a11y-baseline-guard

# 프로젝트 로컬 워크플로 — harness 업데이트 대상 아님.
# 이슈 #535 / R4 cross-validate Gemini 고유 발견 2 후속.
# `docs/benchmarks/a11y-baseline.json` 대비 회귀 (axe 위반 신규 / 폰트 축소 / contrast 저하)
# 감지 시 PR 차단. baseline 갱신은 의도적 — PR 본문에 갱신 사유 박제 필수.

# 같은 sha 의 push+PR 중복 run 제거 (#779). group 에 github.workflow 포함 →
# 워크플로 간 교차 취소 방지. PR head sha == 머지 후 push sha 로 수렴 → 같은 sha 묶임.
# cancel 은 가드 약화 아님 — 동일 코드를 검증하는 중복 run 중 하나만 남김 (포착 100%).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [develop, main]
    # #626 — docs/ADR/워크플로만 바뀐 PR 은 a11y 측정이 무의미(런타임 무관)한데 20분 실 브라우저
    # 측정 후 timeout cancelled (PR #625 ADR-only 실측). 런타임 영향 없는 경로는 skip (fail-safe —
    # 코드/데이터/config 가 하나라도 있으면 실행). paths filter 효과는 base 브랜치 반영 후 후속 PR 부터.
    # #814 — `.github/**` → `.github/workflows/**` 축소: composite action (.github/actions/**) 은
    # setup/build 런타임에 직접 관여하므로 변경 PR 에서 본 가드가 발화해야 함 (#813 구조적 사각 해소).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
      # #915 — diff-scope 분류기 (scripts/ci-diff-scope.mjs) 의 docs 계약과 정합:
      # .claude/** 는 런타임 무관 (SSoT 가드는 ci.yml 상시 스텝이 담당) — 실 브라우저 측정 스킵
      - '.claude/**'
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
      # #915 — diff-scope 분류기 (scripts/ci-diff-scope.mjs) 의 docs 계약과 정합:
      # .claude/** 는 런타임 무관 (SSoT 가드는 ci.yml 상시 스텝이 담당) — 실 브라우저 측정 스킵
      - '.claude/**'
  # #663 — 수동 재실측 경로. workflow_dispatch 2단계 함정 (volt #45): dispatch 버튼은
  # 본 트리거가 default branch (main) 에 반영된 후에만 표시됨 (v0.24.0 릴리스 이후 사용 가능).
  workflow_dispatch:

jobs:
  a11y-baseline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # setup 공통 구간 (pnpm/node/rust/wasm-pack/playwright 캐시/build/dev server) — #802 SSoT,
      # #814 잔존 복제 치환. ci.yml R1 가드 패턴 따름 — wasm 빌드 후 next dev 기동
      # (next build (production) 는 dev 전용 핸들 (`__solarScene`) 미노출이므로 next dev 사용).
      - name: setup + build + dev server (composite)
        uses: ./.github/actions/setup-and-build
        with:
          start-dev-server: 'true'

      - name: a11y baseline 회귀 검증
        run: BASE_URL=http://localhost:3001 node scripts/verify-a11y-baseline.mjs

      # #749 — canvas 위 HUD 텍스트 배경 무관 대비 정적 가드 (axe 가 canvas exclude 로 못 잡는
      # 동적 배경 결함). 위 dev server 재사용 (별도 20분 job 중복 회피).
      - name: HUD 배경 무관 대비 검증 (#749)
        run: BASE_URL=http://localhost:3001 node scripts/verify-hud-contrast.mjs

      - name: dev server 정리
        if: always()
        run: |
          if [[ -f /tmp/next-pid ]]; then
            kill $(cat /tmp/next-pid) || true
          fi

      - name: 회귀 보고서 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-baseline-report
          path: |
            .verify-screenshots/a11y-baseline/
            docs/benchmarks/a11y-baseline.json
          retention-days: 7
